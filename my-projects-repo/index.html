<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects · 我的小项目</title>
<meta name="description" content="一些自娱自乐的可交互小项目集合。">
<script>
  // 尽早决定主题，避免首屏闪白
  (function () {
    try {
      var s = localStorage.getItem('theme');
      var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = s || (dark ? 'dark' : 'light');
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --bg: #f7f8fa;
    --bg-soft: #eef0f4;
    --card: #ffffff;
    --text: #14161a;
    --muted: #6b7280;
    --faint: #9aa1ac;
    --border: #e4e7ec;
    --border-hover: #c9cfd9;
    --accent: #3355ff;
    --accent-soft: rgba(51, 85, 255, .08);
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px -12px rgba(16, 24, 40, .12);
    --shadow-hover: 0 2px 4px rgba(16, 24, 40, .05), 0 18px 40px -18px rgba(16, 24, 40, .22);
    --radius: 14px;
  }

  :root[data-theme="dark"] {
    --bg: #0d0f13;
    --bg-soft: #14171d;
    --card: #161a21;
    --text: #e8eaee;
    --muted: #98a1ae;
    --faint: #6b7482;
    --border: #252b34;
    --border-hover: #39424f;
    --accent: #8aa5ff;
    --accent-soft: rgba(138, 165, 255, .1);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -12px rgba(0, 0, 0, .6);
    --shadow-hover: 0 2px 4px rgba(0, 0, 0, .45), 0 18px 40px -18px rgba(0, 0, 0, .75);
  }

  * { box-sizing: border-box; }

  /* 保证 hidden 能盖过 .grid 的 display:grid */
  [hidden] { display: none !important; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    padding: 0 20px 72px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    transition: background-color .25s ease, color .25s ease;
  }

  .wrap { max-width: 1080px; margin: 0 auto; }

  /* ---------- 头部 ---------- */
  header { padding: 64px 0 28px; }

  .head-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }

  h1 {
    margin: 0;
    font-size: 30px;
    line-height: 1.2;
    font-weight: 650;
    letter-spacing: -.02em;
  }

  h1 .dot { color: var(--accent); }

  .sub {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 14px;
  }

  .sub b { color: var(--text); font-weight: 600; }

  /* ---------- 主题按钮 ---------- */
  .theme-btn {
    flex: none;
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    border-radius: 10px;
    cursor: pointer;
    transition: color .18s, border-color .18s, background .18s;
  }

  .theme-btn:hover { color: var(--text); border-color: var(--border-hover); }
  .theme-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .theme-btn svg { width: 17px; height: 17px; display: block; }
  :root[data-theme="light"] .icon-moon { display: none; }
  :root[data-theme="dark"] .icon-sun { display: none; }

  /* ---------- 搜索 ---------- */
  .search {
    position: relative;
    margin-top: 26px;
  }

  .search svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: var(--faint);
    pointer-events: none;
  }

  #q {
    width: 100%;
    padding: 12px 56px 12px 40px;
    font: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 11px;
    outline: none;
    transition: border-color .18s, box-shadow .18s;
  }

  #q::placeholder { color: var(--faint); }

  #q:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  #q:focus ~ kbd { opacity: 0; }

  kbd {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font: inherit;
    font-size: 11px;
    line-height: 1;
    padding: 5px 7px;
    color: var(--faint);
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 6px;
    pointer-events: none;
    transition: opacity .18s;
  }

  /* ---------- 卡片网格 ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
    gap: 14px;
    margin-top: 26px;
  }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 132px;
    padding: 18px 18px 15px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    text-decoration: none;
    color: inherit;
    box-shadow: var(--shadow);
    transition: transform .2s cubic-bezier(.2,.7,.3,1), box-shadow .2s,
                border-color .2s, background-color .25s;
    animation: rise .32s cubic-bezier(.2,.7,.3,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  .card:hover {
    transform: translateY(-2px);
    border-color: var(--border-hover);
    box-shadow: var(--shadow-hover);
  }

  .card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .card-title {
    font-size: 15.5px;
    font-weight: 600;
    line-height: 1.45;
    letter-spacing: -.01em;
    padding-right: 22px;
  }

  .card-desc {
    margin: 7px 0 0;
    font-size: 13px;
    line-height: 1.62;
    color: var(--muted);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-foot {
    margin-top: auto;
    padding-top: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .slug {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    color: var(--faint);
    letter-spacing: .01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .arrow {
    flex: none;
    color: var(--faint);
    transition: color .2s, transform .2s;
  }

  .arrow svg { width: 14px; height: 14px; display: block; }

  .card:hover .arrow {
    color: var(--accent);
    transform: translate(2px, -2px);
  }

  /* ---------- 状态块 ---------- */
  .state {
    margin-top: 26px;
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    background: var(--card);
  }

  .state strong { color: var(--text); font-weight: 600; }

  .state code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px;
    padding: 2px 6px;
    margin: 0 2px;
    background: var(--bg-soft);
    border-radius: 5px;
  }

  footer {
    margin-top: 44px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    color: var(--faint);
    font-size: 12.5px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    justify-content: space-between;
  }

  footer a { color: var(--muted); }

  @media (max-width: 560px) {
    body { padding: 0 16px 56px; }
    header { padding: 40px 0 22px; }
    h1 { font-size: 25px; }
    .grid { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-row">
      <div>
        <h1>Projects<span class="dot">.</span></h1>
        <p class="sub"><b id="count">—</b> 个项目 · 都是点开就能玩的东西</p>
      </div>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="切换深色 / 浅色模式">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
        </svg>
      </button>
    </div>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-3.5-3.5"></path>
      </svg>
      <input id="q" type="search" placeholder="搜索项目…" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>
  </header>

  <main class="grid" id="grid" aria-live="polite"></main>
  <div class="state" id="state" hidden></div>

  <footer>
    <span>由 <code style="font-family:ui-monospace,monospace">sync.mjs</code> 生成 · 列表来自 projects.json</span>
    <span id="filtered"></span>
  </footer>
</div>

<script>
(function () {
  var root = document.documentElement;
  var grid = document.getElementById('grid');
  var stateBox = document.getElementById('state');
  var q = document.getElementById('q');
  var countEl = document.getElementById('count');
  var filteredEl = document.getElementById('filtered');
  var btn = document.getElementById('themeBtn');

  /* ---------- 主题 ---------- */
  btn.addEventListener('click', function () {
    var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
  });

  // 用户没手动选过时，跟随系统变化
  try {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (err) {}
      if (!saved) root.dataset.theme = e.matches ? 'dark' : 'light';
    });
  } catch (e) {}

  /* ---------- 渲染 ---------- */
  var projects = [];

  function showState(html) {
    stateBox.innerHTML = html;
    stateBox.hidden = false;
  }

  function linkFor(p) {
    // 相对路径，不依赖仓库名 / 域名
    return './' + encodeURI(String(p.path || 'projects/' + p.name).replace(/^\/+/, '')) + '/';
  }

  function render(list) {
    if (!list.length) {
      grid.innerHTML = '';
      grid.hidden = true;
      if (projects.length) {
        showState('没有匹配 “' + escapeHtml(q.value.trim()) + '” 的项目。');
      }
      return;
    }

    grid.hidden = false;
    stateBox.hidden = true;
    grid.innerHTML = '';

    list.forEach(function (p, i) {
      var a = document.createElement('a');
      a.className = 'card';
      a.href = linkFor(p);
      a.style.animationDelay = Math.min(i, 12) * 22 + 'ms';

      var title = document.createElement('div');
      title.className = 'card-title';
      title.textContent = p.title || p.name;

      a.appendChild(title);

      if (p.desc) {
        var d = document.createElement('p');
        d.className = 'card-desc';
        d.textContent = p.desc;
        a.appendChild(d);
      }

      var foot = document.createElement('div');
      foot.className = 'card-foot';

      var slug = document.createElement('span');
      slug.className = 'slug';
      slug.textContent = p.name;
      foot.appendChild(slug);

      var arrow = document.createElement('span');
      arrow.className = 'arrow';
      arrow.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"'
        + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
        + '<path d="M7 17L17 7M9 7h8v8"/></svg>';
      foot.appendChild(arrow);

      a.appendChild(foot);
      grid.appendChild(a);
    });

    filteredEl.textContent = q.value.trim() ? '筛选出 ' + list.length + ' / ' + projects.length : '';
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function applyFilter() {
    var kw = q.value.trim().toLowerCase();
    if (!kw) return render(projects);
    render(projects.filter(function (p) {
      return [p.title, p.name, p.desc].join(' ').toLowerCase().indexOf(kw) !== -1;
    }));
  }

  /* ---------- 载入数据 ---------- */
  fetch('projects.json', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      projects = (Array.isArray(data) ? data : data.projects || []).filter(function (p) {
        return p && (p.path || p.name);
      });
      countEl.textContent = projects.length;
      if (!projects.length) {
        grid.hidden = true;
        showState('还没有项目。在源目录里放点东西，然后运行 <code>node sync.mjs</code>。');
        return;
      }
      applyFilter();
    })
    .catch(function (err) {
      countEl.textContent = '0';
      grid.hidden = true;
      showState(
        '<strong>读取 projects.json 失败</strong><br>' +
        '如果是在本地直接双击打开这个文件，浏览器会拦截本地文件请求。<br>' +
        '请在该目录下起一个本地服务器再看，例如 <code>npx serve</code> 或 <code>python -m http.server</code>。<br>' +
        '<span style="font-size:12.5px;opacity:.7">' + escapeHtml(err.message) + '</span>'
      );
    });

  /* ---------- 快捷键 ---------- */
  q.addEventListener('input', applyFilter);

  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    var typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;

    if (e.key === '/' && !typing) {
      e.preventDefault();
      q.focus();
      q.select();
    } else if (e.key === 'Escape' && document.activeElement === q) {
      q.value = '';
      applyFilter();
      q.blur();
    }
  });
})();
</script>
</body>
</html>

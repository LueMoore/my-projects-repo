<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>键盘钢琴 · Keyboard Piano</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ww:56px;
  --text:#e9edf5;
  --dim:#7d8798;
  --cy:#7dd3fc;
  --pu:#a78bfa;
  --am:#ffb454;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html,body{min-height:100%}
body{
  background:#07090e;
  color:var(--text);
  font-family:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  min-height:100vh;
  display:flex;align-items:flex-start;justify-content:center;
  padding:34px 18px;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

/* 背景光晕 */
.aurora{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(58% 42% at 16% 8%, rgba(110,231,240,.11), transparent 70%),
    radial-gradient(52% 38% at 84% 4%, rgba(167,139,250,.12), transparent 70%),
    radial-gradient(72% 46% at 50% 104%, rgba(255,180,84,.07), transparent 70%);
}

.app{
  position:relative;z-index:1;
  width:100%;max-width:1200px;min-width:0;
  display:flex;flex-direction:column;align-items:center;
  gap:16px;
  margin:auto;
}

/* ---------- 标题 ---------- */
.head{text-align:center}
h1{
  font-size:clamp(21px,2.8vw,29px);
  font-weight:700;letter-spacing:.22em;
  background:linear-gradient(100deg,#c8f2ff,#a78bfa 46%,#ffb454);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:6px;
}
.sub{
  font-size:12px;color:var(--dim);letter-spacing:.09em;
}

/* ---------- 音色 ---------- */
.timbres{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.tbtn{
  padding:8px 15px;border-radius:999px;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.045);
  color:#a8b2c4;font-size:12.5px;letter-spacing:.03em;
  cursor:pointer;transition:.22s cubic-bezier(.2,.8,.2,1);
  backdrop-filter:blur(8px);
  font-family:inherit;
}
.tbtn:hover{color:#fff;border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.085);transform:translateY(-1px)}
.tbtn.on{
  color:#080a10;font-weight:700;
  background:linear-gradient(135deg,#c8f2ff,#7dd3fc 52%,#a78bfa);
  border-color:transparent;
  box-shadow:0 7px 22px -8px rgba(125,211,252,.8);
  transform:translateY(-1px);
}

/* ---------- 旋钮区 ---------- */
.knobs{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:center}
.knob{display:flex;align-items:center;gap:8px;font-size:12px;color:#8791a3}
.knob b{
  color:#c9d3e3;font-weight:600;min-width:30px;
  font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:11.5px;
}
input[type=range]{
  -webkit-appearance:none;appearance:none;
  width:100px;height:3px;border-radius:3px;
  background:linear-gradient(90deg,rgba(125,211,252,.85),rgba(167,139,250,.85));
  outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:#eef4ff;
  box-shadow:0 0 0 3px rgba(125,211,252,.20),0 2px 7px rgba(0,0,0,.65);
  transition:transform .15s;
}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.18)}
input[type=range]::-moz-range-thumb{
  width:13px;height:13px;border:none;border-radius:50%;background:#eef4ff;
  box-shadow:0 0 0 3px rgba(125,211,252,.20),0 2px 7px rgba(0,0,0,.65);
}
.pedal{
  display:flex;align-items:center;gap:7px;
  padding:7px 15px;border-radius:999px;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.045);
  color:#a8b2c4;font-size:12px;cursor:pointer;
  transition:.2s;font-family:inherit;
}
.pedal:hover{color:#fff;border-color:rgba(255,255,255,.22)}
.pedal.on{
  background:rgba(255,180,84,.15);
  border-color:rgba(255,180,84,.55);
  color:#ffcf8a;
  box-shadow:0 0 26px -8px rgba(255,180,84,.85);
}
kbd{
  font-family:var(--mono);font-size:10.5px;
  padding:2px 6px;border-radius:5px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.13);
  color:#b8c2d4;
}

/* ---------- 示波器 ---------- */
.scope-wrap{
  width:100%;height:62px;
  border-radius:12px;overflow:hidden;
  background:rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.055);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset;
}
#scope{width:100%;height:100%;display:block}

/* ---------- 钢琴 ---------- */
.piano-wrap{
  width:100%;min-width:0;display:flex;
  overflow-x:auto;overflow-y:hidden;
  padding:4px 0 12px;
  scrollbar-width:thin;
}
.piano-wrap::-webkit-scrollbar{height:6px}
.piano-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}

.piano{
  position:relative;
  display:flex;
  padding:14px 14px 16px;
  border-radius:16px;
  background:linear-gradient(180deg,#1a1d26 0%,#11141b 42%,#0a0c11 100%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.08) inset,
    0 -3px 0 rgba(0,0,0,.65) inset,
    0 34px 74px -26px rgba(0,0,0,.95),
    0 0 0 1px rgba(255,255,255,.055);
  touch-action:pan-x;   /* 手机上允许左右滑动查看整架琴，点击仍可发声 */
  flex:none;
  margin:0 auto;        /* 空间够就居中，不够时从左边开始，不被裁掉头 */
}

/* 白键 */
.key{
  position:relative;
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  transition:transform .055s ease-out, background .13s, box-shadow .13s;
  will-change:transform;
}
.key.white{
  width:var(--ww);
  height:clamp(152px, calc(var(--ww) * 4.15), 302px);
  border-radius:0 0 7px 7px;
  background:linear-gradient(180deg,#fdfcf9 0%,#f7f4ed 52%,#e6e1d5 90%,#d5cfc0 100%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.95) inset,
    -1px 0 0 rgba(0,0,0,.14) inset,
    0 -7px 11px -7px rgba(0,0,0,.5) inset,
    0 3px 5px -3px rgba(0,0,0,.6);
  cursor:pointer;
  z-index:1;
}
.key.white.on{
  background:linear-gradient(180deg,#ffeecb 0%,#ffd98f 44%,#ffbe5e 84%,#f9a63c 100%);
  transform:translateY(3px);
  box-shadow:
    0 0 0 1px rgba(255,180,84,.5) inset,
    0 -11px 20px -9px rgba(168,84,0,.55) inset,
    0 0 30px -3px rgba(255,180,84,.62);
}

/* 黑键 */
.key.black{
  position:absolute;
  top:14px;
  width:calc(var(--ww) * .62);
  height:clamp(94px, calc(var(--ww) * 4.15 * .62), 187px);
  left:calc(14px + var(--ww) * var(--wn) - var(--ww) * .31);
  border-radius:0 0 5px 5px;
  background:linear-gradient(180deg,#3d414c 0%,#24272f 38%,#101217 82%,#07080b 100%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.20) inset,
    0 -6px 9px -5px rgba(0,0,0,.95) inset,
    0 9px 15px -7px rgba(0,0,0,.95);
  cursor:pointer;
  z-index:3;
}
.key.black.on{
  background:linear-gradient(180deg,#a8701f 0%,#e09a34 34%,#ffc069 76%,#ffd79a 100%);
  transform:translateY(3px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.45) inset,
    0 0 26px -1px rgba(255,180,84,.7),
    0 3px 7px -2px rgba(0,0,0,.75);
}

/* 键帽文字 */
.key .cap{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:32px;
  padding:2px 6px;border-radius:5px;
  font-family:var(--mono);font-size:10.5px;font-weight:600;line-height:1.25;
  color:#5b6472;
  background:rgba(0,0,0,.055);
  border:1px solid rgba(0,0,0,.075);
  pointer-events:none;
  white-space:nowrap;
  text-align:center;
  transition:color .13s, background .13s, border-color .13s;
}
.key .cap i{display:block;font-style:normal}
.key .cap i + i{font-size:.8em;opacity:.62;margin-top:1px}
.key.black .cap{
  bottom:26px;
  font-size:9px;
  padding:1px 4px;
  color:#717a8c;
  background:rgba(255,255,255,.085);
  border-color:rgba(255,255,255,.10);
}
.key .name{
  position:absolute;left:0;right:0;bottom:11px;
  text-align:center;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;
  color:#8b939f;
  pointer-events:none;
}
.key.black .name{bottom:9px;font-size:8.5px;color:#646d7c}
.key.white.on .cap{color:#8a4a00;background:rgba(255,255,255,.42);border-color:rgba(180,90,0,.22)}
.key.white.on .name{color:#a35c05}
.key.black.on .cap{color:#3a2000;background:rgba(255,255,255,.5);border-color:transparent}
.key.black.on .name{color:#4a2a00}

/* C 音标记 */
.key.white.is-c .name{color:#5d8fb8;font-weight:700}
.key.white.is-c.on .name{color:#8a4a00}

/* ---------- 读数 ---------- */
.readout{
  display:flex;align-items:center;gap:10px;
  min-height:34px;padding:6px 16px;border-radius:999px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.06);
  font-size:12.5px;color:var(--dim);
  transition:.25s;
}
.readout .dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(255,255,255,.22);
  transition:.25s;
  flex:none;
}
.readout.live{color:#dbe6f5;border-color:rgba(125,211,252,.25);background:rgba(125,211,252,.055)}
.readout.live .dot{background:var(--cy);box-shadow:0 0 9px var(--cy);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.chip{
  display:inline-block;
  font-family:var(--mono);font-size:11.5px;font-weight:600;
  padding:1px 7px;margin:0 3px;border-radius:5px;
  background:rgba(125,211,252,.14);
  color:#a5e4ff;
  border:1px solid rgba(125,211,252,.22);
}

/* ---------- 说明 ---------- */
.hint{
  display:flex;flex-direction:column;gap:5px;align-items:center;
  font-size:11.5px;color:#737e8f;text-align:center;line-height:1.85;
  letter-spacing:.02em;
}
.hint b{color:#9aa5b6;font-weight:600}
.hint .mono{font-family:var(--mono);color:#94a0b2;letter-spacing:.04em}
.hint .dim{color:#6b7686}

@media (max-width:640px){
  body{padding:22px 10px}
  .knobs{gap:14px}
  input[type=range]{width:76px}
  .hint{font-size:10.5px}
}
</style>
</head>
<body>

<div class="aurora"></div>

<main class="app">
  <header class="head">
    <h1>键盘钢琴</h1>
    <p class="sub">用电脑键盘演奏 · 8 种音色 · Web Audio 实时合成</p>
  </header>

  <section class="timbres" id="timbres"></section>

  <section class="knobs">
    <label class="knob">音量 <input type="range" id="vol" min="0" max="100" value="76"><b id="volv">76</b></label>
    <label class="knob">混响 <input type="range" id="rev" min="0" max="100" value="30"><b id="revv">30</b></label>
    <label class="knob">八度 <input type="range" id="oct" min="-1" max="1" step="1" value="0"><b id="octv">0</b></label>
    <button class="pedal" id="pedal">延音踏板 <kbd>Space</kbd></button>
  </section>

  <div class="scope-wrap"><canvas id="scope"></canvas></div>

  <div class="piano-wrap">
    <div class="piano" id="piano"></div>
  </div>

  <div class="readout" id="readout">
    <span class="dot"></span>
    <div id="nowplay">等待演奏…</div>
  </div>

  <footer class="hint">
    <div><b>下排</b> <span class="mono">Z S X D C V G B H N J M , L . ; /</span> → C3 – E4</div>
    <div><b>上排</b> <span class="mono">Q 2 W 3 E R 5 T 6 Y 7 U I 9 O 0 P</span> → C4 – E5</div>
    <div class="dim">按住 <kbd>Space</kbd> 踩下延音踏板 · 松手即停 · 鼠标点按 / 按住拖动可滑奏</div>
  </footer>
</main>

<script>
"use strict";

/* =========================================================
   1. 基础常量
   ========================================================= */
const START_MIDI = 48;   // C3
const END_MIDI   = 76;   // E5
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const WHITE_PC   = new Set([0,2,4,5,7,9,11]);   // 白键音级
const EPS = 0.0001;

const midiToName = m => NOTE_NAMES[m % 12] + (Math.floor(m / 12) - 1);
const midiToFreq = m => 440 * Math.pow(2, (m - 69) / 12);

/* 电脑键盘绑定：[e.code, 显示字符, MIDI] */
const BINDINGS = [
  ['KeyZ','Z',48],['KeyS','S',49],['KeyX','X',50],['KeyD','D',51],['KeyC','C',52],
  ['KeyV','V',53],['KeyG','G',54],['KeyB','B',55],['KeyH','H',56],['KeyN','N',57],
  ['KeyJ','J',58],['KeyM','M',59],['Comma',',',60],['KeyL','L',61],['Period','.',62],
  ['Semicolon',';',63],['Slash','/',64],
  ['KeyQ','Q',60],['Digit2','2',61],['KeyW','W',62],['Digit3','3',63],['KeyE','E',64],
  ['KeyR','R',65],['Digit5','5',66],['KeyT','T',67],['Digit6','6',68],['KeyY','Y',69],
  ['Digit7','7',70],['KeyU','U',71],['KeyI','I',72],['Digit9','9',73],['KeyO','O',74],
  ['Digit0','0',75],['KeyP','P',76]
];

const codeToMidi = new Map();      // 'KeyZ' -> 48
const midiToLabels = new Map();    // 48 -> ['Z']
BINDINGS.forEach(([code, label, midi]) => {
  codeToMidi.set(code, midi);
  if (!midiToLabels.has(midi)) midiToLabels.set(midi, []);
  midiToLabels.get(midi).push(label);
});

/* =========================================================
   2. 音频引擎
   ========================================================= */
let ctx = null;
let master, comp, analyser, convolver, wetGain, noiseBuf;

const state = {
  timbre: 'grand',
  volume: 0.76,
  reverb: 0.30,
  octave: 0,
  pedal: false
};

function makeIR(seconds, decay) {
  const rate = ctx.sampleRate;
  const len  = Math.floor(rate * seconds);
  const buf  = ctx.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      const p = i / len;
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - p, decay);
    }
  }
  return buf;
}

function ensureAudio() {
  if (ctx) {
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  ctx = new AC();

  master = ctx.createGain();
  master.gain.value = state.volume;

  comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14;
  comp.knee.value = 14;
  comp.ratio.value = 5;
  comp.attack.value = 0.003;
  comp.release.value = 0.25;

  analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.75;

  master.connect(comp);
  comp.connect(analyser);
  analyser.connect(ctx.destination);

  // 混响支路
  convolver = ctx.createConvolver();
  convolver.buffer = makeIR(2.6, 2.9);
  wetGain = ctx.createGain();
  wetGain.gain.value = state.reverb;
  convolver.connect(wetGain);
  wetGain.connect(master);

  // 复用的白噪声（气声 / 拨弦瞬态）
  const nlen = Math.floor(ctx.sampleRate * 1.2);
  noiseBuf = ctx.createBuffer(1, nlen, ctx.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nlen; i++) nd[i] = Math.random() * 2 - 1;

  return ctx;
}

/* 包络形状：attack 到 peak，decay 到 sustain 电平 */
function shape(env, t, peak, a, d, s) {
  const g = env.gain;
  g.setValueAtTime(EPS, t);
  g.exponentialRampToValueAtTime(peak, t + a);
  g.exponentialRampToValueAtTime(Math.max(peak * s, 0.0002), t + a + d);
}

/* cancelAndHoldAtTime 的兼容封装 */
function holdAt(param, t) {
  if (typeof param.cancelAndHoldAtTime === 'function') {
    try { param.cancelAndHoldAtTime(t); return; } catch (e) {}
  }
  param.cancelScheduledValues(t);
  param.setValueAtTime(Math.max(param.value, EPS), t);
}

/* =========================================================
   3. 音色定义
   build(freq, t, env) → { oscs, release }
   env 是音符总包络，build 负责设定形状并挂接振荡器
   ========================================================= */
const TIMBRES = {

  /* --- 大钢琴：多谐波叠加，高次谐波衰减更快 --- */
  grand: {
    name: '大钢琴',
    wet: 0.26,
    build(freq, t, env) {
      shape(env, t, 0.82, 0.006, 0.6, 0.44);
      env.gain.exponentialRampToValueAtTime(0.15, t + 4.6);

      const H = [
        [1, 0.56, 'triangle', 3.4, 0],
        [2, 0.25, 'sine',     2.1, 1.6],
        [3, 0.12, 'sine',     1.3, 3.4],
        [4, 0.06, 'sine',     0.85, 5.0],
        [5, 0.03, 'sine',     0.58, 6.6],
        [6, 0.016,'sine',     0.42, 8.2]
      ];
      const oscs = [];
      H.forEach(([r, amp, type, dec, det]) => {
        const o = ctx.createOscillator();
        o.type = type;
        o.frequency.value = freq * r;
        o.detune.value = det;
        const g = ctx.createGain();
        g.gain.setValueAtTime(EPS, t);
        g.gain.linearRampToValueAtTime(amp, t + 0.009);
        g.gain.exponentialRampToValueAtTime(EPS, t + dec);
        o.connect(g); g.connect(env);
        o.start(t);
        oscs.push(o);
      });
      return { oscs, release: 0.28 };
    }
  },

  /* --- 电钢：FM 合成，调制指数快速回落 --- */
  electric: {
    name: '电钢',
    wet: 0.30,
    build(freq, t, env) {
      shape(env, t, 0.60, 0.005, 1.5, 0.34);
      env.gain.exponentialRampToValueAtTime(0.10, t + 3.6);

      const carrier = ctx.createOscillator();
      carrier.type = 'sine';
      carrier.frequency.value = freq;

      const mod = ctx.createOscillator();
      mod.type = 'sine';
      mod.frequency.value = freq;
      const modGain = ctx.createGain();
      modGain.gain.setValueAtTime(freq * 2.7, t);
      modGain.gain.exponentialRampToValueAtTime(freq * 0.06, t + 1.15);
      mod.connect(modGain);
      modGain.connect(carrier.frequency);

      const bell = ctx.createOscillator();
      bell.type = 'sine';
      bell.frequency.value = freq * 2;
      const bellGain = ctx.createGain();
      bellGain.gain.setValueAtTime(0.12, t);
      bellGain.gain.exponentialRampToValueAtTime(EPS, t + 1.4);

      carrier.connect(env);
      bell.connect(bellGain); bellGain.connect(env);
      [carrier, mod, bell].forEach(o => o.start(t));

      return { oscs: [carrier, mod, bell], release: 0.34 };
    }
  },

  /* --- 八音盒：高频 FM + 极快衰减 --- */
  musicbox: {
    name: '八音盒',
    wet: 0.34,
    build(freq, t, env) {
      const g = env.gain;
      g.setValueAtTime(EPS, t);
      g.exponentialRampToValueAtTime(0.46, t + 0.003);
      g.exponentialRampToValueAtTime(0.09, t + 0.85);
      g.exponentialRampToValueAtTime(0.02, t + 3.0);

      const car = ctx.createOscillator();
      car.type = 'sine';
      car.frequency.value = freq;

      const mod = ctx.createOscillator();
      mod.type = 'sine';
      mod.frequency.value = freq * 3.02;
      const mg = ctx.createGain();
      mg.gain.setValueAtTime(freq * 1.9, t);
      mg.gain.exponentialRampToValueAtTime(freq * 0.04, t + 0.7);
      mod.connect(mg); mg.connect(car.frequency);

      const h2 = ctx.createOscillator();
      h2.type = 'sine';
      h2.frequency.value = freq * 2;
      const h2g = ctx.createGain();
      h2g.gain.value = 0.13;

      car.connect(env);
      h2.connect(h2g); h2g.connect(env);
      [car, mod, h2].forEach(o => o.start(t));

      return { oscs: [car, mod, h2], release: 0.26 };
    }
  },

  /* --- 吉他：锯齿 + 滤波包络 + 拨弦噪声瞬态 --- */
  guitar: {
    name: '吉他',
    wet: 0.24,
    build(freq, t, env) {
      const g = env.gain;
      g.setValueAtTime(EPS, t);
      g.exponentialRampToValueAtTime(0.58, t + 0.004);
      g.exponentialRampToValueAtTime(0.22, t + 0.7);
      g.exponentialRampToValueAtTime(0.11, t + 2.6);

      const o = ctx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.value = freq;

      const filt = ctx.createBiquadFilter();
      filt.type = 'lowpass';
      filt.frequency.setValueAtTime(Math.min(freq * 14, 12000), t);
      filt.frequency.exponentialRampToValueAtTime(Math.max(freq * 2.2, 320), t + 0.55);
      filt.Q.value = 1.4;

      o.connect(filt); filt.connect(env);
      o.start(t);

      const n = ctx.createBufferSource();
      n.buffer = noiseBuf;
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 1800;
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(0.16, t);
      ng.gain.exponentialRampToValueAtTime(EPS, t + 0.05);
      n.connect(hp); hp.connect(ng); ng.connect(env);
      n.start(t); n.stop(t + 0.06);

      return { oscs: [o, n], release: 0.17 };
    }
  },

  /* --- 管风琴：加法合成，起音干脆，持续平稳 --- */
  organ: {
    name: '管风琴',
    wet: 0.30,
    build(freq, t, env) {
      const g = env.gain;
      g.setValueAtTime(EPS, t);
      g.exponentialRampToValueAtTime(0.60, t + 0.013);
      g.exponentialRampToValueAtTime(0.54, t + 0.13);

      const draws = [[1,0.30],[2,0.20],[3,0.12],[4,0.09],[6,0.06],[8,0.04]];
      const oscs = [];
      draws.forEach(([r, amp]) => {
        const o = ctx.createOscillator();
        o.type = 'sine';
        o.frequency.value = freq * r;
        const gg = ctx.createGain();
        gg.gain.value = amp;
        o.connect(gg); gg.connect(env);
        o.start(t);
        oscs.push(o);
      });
      return { oscs, release: 0.14 };
    }
  },

  /* --- 弦乐：四层锯齿失谐 + 低通 + 颤音 --- */
  strings: {
    name: '弦乐',
    wet: 0.42,
    build(freq, t, env) {
      const g = env.gain;
      g.setValueAtTime(EPS, t);
      g.exponentialRampToValueAtTime(0.50, t + 0.19);
      g.exponentialRampToValueAtTime(0.42, t + 0.62);

      const filt = ctx.createBiquadFilter();
      filt.type = 'lowpass';
      filt.frequency.value = Math.min(freq * 7, 5400);
      filt.Q.value = 0.9;
      filt.connect(env);

      const oscs = [];
      [-11, -4, 4, 11].forEach(det => {
        const o = ctx.createOscillator();
        o.type = 'sawtooth';
        o.frequency.value = freq;
        o.detune.value = det;
        const gg = ctx.createGain();
        gg.gain.value = 0.22;
        o.connect(gg); gg.connect(filt);
        o.start(t);
        oscs.push(o);
      });

      const vib = ctx.createOscillator();
      vib.frequency.value = 5.1;
      const vg = ctx.createGain();
      vg.gain.value = 5.5;
      vib.connect(vg);
      oscs.forEach(o => vg.connect(o.detune));
      vib.start(t);
      oscs.push(vib);

      return { oscs, release: 0.46 };
    }
  },

  /* --- 合成器：双振荡 + 滤波扫频 --- */
  synth: {
    name: '合成器',
    wet: 0.28,
    build(freq, t, env) {
      shape(env, t, 0.40, 0.009, 0.30, 0.62);

      const filt = ctx.createBiquadFilter();
      filt.type = 'lowpass';
      filt.frequency.setValueAtTime(Math.min(freq * 9, 14000), t);
      filt.frequency.exponentialRampToValueAtTime(freq * 2.4, t + 0.55);
      filt.Q.value = 6;
      filt.connect(env);

      const oscs = [];
      [[-7, 'sawtooth', 0.5], [7, 'square', 0.28]].forEach(([det, type, amp]) => {
        const o = ctx.createOscillator();
        o.type = type;
        o.frequency.value = freq;
        o.detune.value = det;
        const gg = ctx.createGain();
        gg.gain.value = amp;
        o.connect(gg); gg.connect(filt);
        o.start(t);
        oscs.push(o);
      });
      return { oscs, release: 0.23 };
    }
  },

  /* --- 长笛：正弦 + 颤音 + 气声噪声 --- */
  flute: {
    name: '长笛',
    wet: 0.38,
    build(freq, t, env) {
      const g = env.gain;
      g.setValueAtTime(EPS, t);
      g.exponentialRampToValueAtTime(0.54, t + 0.095);
      g.exponentialRampToValueAtTime(0.46, t + 0.38);

      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = freq;

      const vib = ctx.createOscillator();
      vib.frequency.value = 5.4;
      const vg = ctx.createGain();
      vg.gain.value = freq * 0.0042;
      vib.connect(vg); vg.connect(o.frequency);

      o.connect(env);

      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuf;
      noise.loop = true;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = Math.min(freq * 2, 6000);
      bp.Q.value = 1.2;
      const ng = ctx.createGain();
      ng.gain.value = 0.05;
      noise.connect(bp); bp.connect(ng); ng.connect(env);

      o.start(t); vib.start(t); noise.start(t);
      return { oscs: [o, vib, noise], release: 0.19 };
    }
  }
};

const TIMBRE_ORDER = ['grand','electric','musicbox','guitar','organ','strings','synth','flute'];

/* =========================================================
   4. 发声 / 收音
   ========================================================= */
const active = new Map();      // midi -> voice
const sustained = new Set();   // 踏板保持中的 voice

function createVoice(midi) {
  const def = TIMBRES[state.timbre];
  const t = ctx.currentTime;
  const freq = midiToFreq(midi + state.octave * 12);

  const out = ctx.createGain();
  out.gain.value = 1;
  out.connect(master);

  const send = ctx.createGain();
  send.gain.value = def.wet;
  out.connect(send);
  send.connect(convolver);

  const env = ctx.createGain();
  env.gain.setValueAtTime(EPS, t);
  env.connect(out);

  const parts = def.build(freq, t, env);
  return { midi, env, out, send, parts, dead: false };
}

function killVoice(v, releaseTime) {
  if (!v || v.dead) return;
  v.dead = true;
  const t = ctx.currentTime;
  const r = releaseTime != null ? releaseTime : (v.parts.release || 0.3);
  const g = v.env.gain;
  try {
    holdAt(g, t);
    g.exponentialRampToValueAtTime(EPS, t + r);
  } catch (e) {}
  v.parts.oscs.forEach(o => {
    try { o.stop(t + r + 0.08); } catch (e) {}
  });
  setTimeout(() => {
    try { v.out.disconnect(); } catch (e) {}
    try { v.send.disconnect(); } catch (e) {}
  }, (r + 0.35) * 1000);
}

/* 按下：发声 + 高亮 */
function press(midi) {
  if (active.has(midi)) return;
  ensureAudio();

  const v = createVoice(midi);
  active.set(midi, v);

  const el = keyEls.get(midi);
  if (el) el.classList.add('on');

  updateReadout();
}

/* 松开：停止（踩了踏板则挂起，等踏板抬起再停） */
function release(midi) {
  const v = active.get(midi);
  if (!v) return;
  active.delete(midi);

  const el = keyEls.get(midi);
  if (el) el.classList.remove('on');

  if (state.pedal) {
    sustained.add(v);
    // 踏板踩太久时限制堆积，掐掉最早的
    if (sustained.size > 16) {
      const oldest = sustained.values().next().value;
      sustained.delete(oldest);
      killVoice(oldest, 0.12);
    }
  } else {
    killVoice(v);
  }
  updateReadout();
}

function flushSustained() {
  sustained.forEach(v => killVoice(v));
  sustained.clear();
}

function stopAll() {
  active.forEach(v => killVoice(v, 0.06));
  active.clear();
  flushSustained();
  keyEls.forEach(el => el.classList.remove('on'));
  updateReadout();
}

/* =========================================================
   5. 建琴键
   ========================================================= */
const piano    = document.getElementById('piano');
const timbreEl = document.getElementById('timbres');
const readout  = document.getElementById('readout');
const nowplay  = document.getElementById('nowplay');

const keyEls = new Map();   // midi -> element
let whiteCount = 17;

function buildKeyboard() {
  piano.innerHTML = '';
  keyEls.clear();

  let whiteIdx = 0;
  for (let m = START_MIDI; m <= END_MIDI; m++) {
    const pc = m % 12;
    const isWhite = WHITE_PC.has(pc);

    const el = document.createElement('div');
    el.className = 'key ' + (isWhite ? 'white' : 'black');
    el.dataset.midi = m;

    if (isWhite) {
      if (pc === 0) el.classList.add('is-c');
      whiteIdx++;
    } else {
      el.style.setProperty('--wn', whiteIdx);
    }

    const labels = midiToLabels.get(m) || [];
    if (labels.length) {
      const cap = document.createElement('span');
      cap.className = 'cap';
      // 重叠区（上下两排都能触发）时，主标签大、副标签小
      labels.forEach(l => {
        const i = document.createElement('i');
        i.textContent = l;
        cap.appendChild(i);
      });
      el.appendChild(cap);
    }

    const nm = document.createElement('span');
    nm.className = 'name';
    nm.textContent = midiToName(m);
    el.appendChild(nm);

    piano.appendChild(el);
    keyEls.set(m, el);
  }

  whiteCount = whiteIdx;
  resizePiano();
}

function resizePiano() {
  const wrap = document.querySelector('.piano-wrap');
  const PAD = 28;                                  // 左右 padding 14 × 2
  const avail = wrap.clientWidth - 4;
  let ww = Math.floor((avail - PAD) / whiteCount); // 保证整架琴不超出容器
  ww = Math.max(34, Math.min(74, ww));

  document.documentElement.style.setProperty('--ww', ww + 'px');
  piano.style.width = (ww * whiteCount + PAD) + 'px';
}

/* =========================================================
   6. 音色按钮
   ========================================================= */
function buildTimbreButtons() {
  timbreEl.innerHTML = '';
  TIMBRE_ORDER.forEach(id => {
    const btn = document.createElement('button');
    btn.className = 'tbtn' + (id === state.timbre ? ' on' : '');
    btn.textContent = TIMBRES[id].name;
    btn.dataset.id = id;
    btn.addEventListener('click', () => {
      btn.blur();                // 避免空格键被按钮吞掉
      if (state.timbre === id) return;
      stopAll();                 // 切音色前先掐掉正在响的音
      state.timbre = id;
      timbreEl.querySelectorAll('.tbtn').forEach(b => b.classList.toggle('on', b.dataset.id === id));
      ensureAudio();
      updateReadout();
    });
    timbreEl.appendChild(btn);
  });
}

/* =========================================================
   7. 读数
   ========================================================= */
function updateReadout() {
  const list = [...active.keys()].sort((a, b) => a - b);

  if (!list.length) {
    readout.classList.remove('live');
    nowplay.textContent = '等待演奏…';
    return;
  }

  readout.classList.add('live');
  nowplay.innerHTML =
    list.map(m => `<span class="chip">${midiToName(m)}</span>`).join('') +
    `<span style="opacity:.5;margin-left:6px;font-size:11px">${TIMBRES[state.timbre].name}</span>`;
}

/* =========================================================
   8. 电脑键盘
   ========================================================= */
const heldCodes = new Set();

window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;

  // 空格：延音踏板
  if (e.code === 'Space') {
    e.preventDefault();
    if (!e.repeat) setPedal(true);
    return;
  }

  const midi = codeToMidi.get(e.code);
  if (midi === undefined) return;
  e.preventDefault();
  if (e.repeat || heldCodes.has(e.code)) return;

  heldCodes.add(e.code);
  press(midi);
});

window.addEventListener('keyup', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    setPedal(false);
    return;
  }

  const midi = codeToMidi.get(e.code);
  if (midi === undefined) return;
  heldCodes.delete(e.code);
  release(midi);
});

// 切走窗口时全部收音，避免"卡住一直响"
window.addEventListener('blur', () => {
  heldCodes.clear();
  stopAll();
  setPedal(false);
});

/* =========================================================
   9. 鼠标 / 触摸
   ========================================================= */
const pointers = new Map();   // pointerId -> midi

piano.addEventListener('pointerdown', e => {
  const el = e.target.closest('.key');
  if (!el) return;
  e.preventDefault();
  ensureAudio();
  const midi = Number(el.dataset.midi);
  pointers.set(e.pointerId, midi);
  press(midi);
});

piano.addEventListener('pointerover', e => {
  if (!pointers.has(e.pointerId)) return;   // 只在按下状态下滑奏
  const el = e.target.closest('.key');
  if (!el) return;
  const midi = Number(el.dataset.midi);
  const old = pointers.get(e.pointerId);
  if (old === midi) return;
  release(old);
  press(midi);
  pointers.set(e.pointerId, midi);
});

function endPointer(e) {
  const midi = pointers.get(e.pointerId);
  if (midi === undefined) return;
  pointers.delete(e.pointerId);
  release(midi);
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);

// 防止拖拽选中
piano.addEventListener('dragstart', e => e.preventDefault());
piano.addEventListener('contextmenu', e => e.preventDefault());

/* =========================================================
   10. 控件
   ========================================================= */
const volEl = document.getElementById('vol');
const revEl = document.getElementById('rev');
const octEl = document.getElementById('oct');
const volv  = document.getElementById('volv');
const revv  = document.getElementById('revv');
const octv  = document.getElementById('octv');
const pedalBtn = document.getElementById('pedal');

volEl.addEventListener('input', () => {
  state.volume = volEl.value / 100;
  volv.textContent = volEl.value;
  if (master) master.gain.setTargetAtTime(state.volume, ctx.currentTime, 0.02);
});

revEl.addEventListener('input', () => {
  state.reverb = revEl.value / 100;
  revv.textContent = revEl.value;
  if (wetGain) wetGain.gain.setTargetAtTime(state.reverb, ctx.currentTime, 0.05);
});

octEl.addEventListener('input', () => {
  const next = Number(octEl.value);
  if (next === state.octave) return;
  stopAll();                 // 换八度时把当前音掐掉，避免频率错乱
  state.octave = next;
  octv.textContent = next > 0 ? '+' + next : String(next);
});

function setPedal(on) {
  if (state.pedal === on) return;
  state.pedal = on;
  pedalBtn.classList.toggle('on', on);
  if (!on) flushSustained();
}

pedalBtn.addEventListener('click', () => {
  pedalBtn.blur();
  ensureAudio();
  setPedal(!state.pedal);
});

/* =========================================================
   11. 示波器
   ========================================================= */
const canvas = document.getElementById('scope');
const cctx = canvas.getContext('2d');
let waveBuf = null;
let dpr = Math.min(window.devicePixelRatio || 1, 2);

function sizeCanvas() {
  const r = canvas.getBoundingClientRect();
  canvas.width  = Math.max(1, Math.floor(r.width * dpr));
  canvas.height = Math.max(1, Math.floor(r.height * dpr));
  if (analyser) waveBuf = new Float32Array(analyser.fftSize);
}
window.addEventListener('resize', () => {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  sizeCanvas();
  resizePiano();
});

function draw() {
  requestAnimationFrame(draw);

  const w = canvas.width / dpr;
  const h = canvas.height / dpr;
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cctx.clearRect(0, 0, w, h);

  // 中线
  cctx.strokeStyle = 'rgba(125,211,252,.18)';
  cctx.lineWidth = 1;
  cctx.beginPath();
  cctx.moveTo(0, h / 2);
  cctx.lineTo(w, h / 2);
  cctx.stroke();

  if (!analyser) return;
  if (!waveBuf || waveBuf.length !== analyser.fftSize) {
    waveBuf = new Float32Array(analyser.fftSize);
  }
  analyser.getFloatTimeDomainData(waveBuf);

  const step = waveBuf.length / w;
  cctx.beginPath();
  for (let x = 0; x < w; x++) {
    const i = Math.floor(x * step);
    const y = h / 2 + waveBuf[i] * h * 0.44;
    if (x === 0) cctx.moveTo(x, y);
    else cctx.lineTo(x, y);
  }

  // 波形下方的柔光填充
  const grad = cctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, 'rgba(125,211,252,.16)');
  grad.addColorStop(0.5, 'rgba(125,211,252,.05)');
  grad.addColorStop(1, 'rgba(125,211,252,0)');
  cctx.save();
  cctx.lineTo(w, h);
  cctx.lineTo(0, h);
  cctx.closePath();
  cctx.fillStyle = grad;
  cctx.fill();
  cctx.restore();

  // 重新描路径（fill 之后 path 已闭合）
  cctx.beginPath();
  for (let x = 0; x < w; x++) {
    const i = Math.floor(x * step);
    const y = h / 2 + waveBuf[i] * h * 0.44;
    if (x === 0) cctx.moveTo(x, y);
    else cctx.lineTo(x, y);
  }
  cctx.strokeStyle = '#7dd3fc';
  cctx.lineWidth = 1.6;
  cctx.lineJoin = 'round';
  cctx.shadowBlur = 12;
  cctx.shadowColor = 'rgba(125,211,252,.75)';
  cctx.stroke();
  cctx.shadowBlur = 0;
}

/* =========================================================
   12. 启动
   ========================================================= */
buildTimbreButtons();
buildKeyboard();
sizeCanvas();
draw();

// 首次交互解锁音频
['pointerdown', 'keydown', 'touchstart'].forEach(ev => {
  window.addEventListener(ev, () => ensureAudio(), { once: true });
});
</script>
</body>
</html>

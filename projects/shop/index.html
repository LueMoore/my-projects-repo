<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>甜蜜小屋 · Three.js 卡通小镇店门口</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #cfe9ff;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #scene { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #scene:active { cursor: grabbing; }

  .hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  .brand { position: absolute; left: 26px; top: 22px; user-select: none; }
  .brand h1 {
    font-size: 27px; font-weight: 800; letter-spacing: 1px; color: #4b3a29;
    text-shadow: 0 2px 0 rgba(255,255,255,.85), 0 6px 18px rgba(120,90,60,.18);
  }
  .brand h1 span { color: #c8543f; }
  .brand p {
    margin-top: 7px; font-size: 11.5px; letter-spacing: 3px; color: #7a6350;
    text-shadow: 0 1px 0 rgba(255,255,255,.7);
  }

  .hint {
    position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
    font-size: 11.5px; letter-spacing: 1.6px; color: #6d5947;
    background: rgba(255,255,255,.55); backdrop-filter: blur(6px);
    padding: 7px 16px; border-radius: 999px; white-space: nowrap;
    border: 1px solid rgba(255,255,255,.8);
    box-shadow: 0 6px 18px rgba(110,85,60,.12);
  }

  .btns { position: absolute; right: 24px; bottom: 22px; display: flex; gap: 9px; pointer-events: auto; }
  .btns button {
    pointer-events: auto; cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 600; letter-spacing: .5px;
    color: #5a4634; padding: 9px 16px 9px 14px; border-radius: 999px;
    background: rgba(255,255,255,.72); border: 1px solid rgba(255,255,255,.95);
    backdrop-filter: blur(8px);
    box-shadow: 0 6px 18px rgba(110,85,60,.16);
    transition: transform .16s ease, background .16s ease, box-shadow .16s ease;
  }
  .btns button:hover { transform: translateY(-2px); background: #fff; box-shadow: 0 10px 24px rgba(110,85,60,.22); }
  .btns button:active { transform: translateY(0) scale(.98); }
  .btns button.on { background: #ffe0ad; color: #6b4a24; border-color: #ffcf86; }

  #loading {
    position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: linear-gradient(180deg, #d9efff 0%, #ffe9cd 100%);
    transition: opacity .7s ease, visibility .7s ease;
  }
  #loading.hide { opacity: 0; visibility: hidden; }
  #loading .cup { font-size: 40px; animation: bob 1.3s ease-in-out infinite; }
  #loading .txt { font-size: 12.5px; letter-spacing: 3px; color: #8b7259; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-10px) rotate(4deg); } }
  #err {
    position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center;
    background: #1b1b22; color: #ffd9d9; font-size: 14px; padding: 40px; text-align: center; line-height: 2;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="hud">
  <div class="brand">
    <h1>甜蜜小屋 <span>Sweet Shop</span></h1>
    <p>THREE.JS · 卡通小镇的清晨</p>
  </div>

  <div class="hint">拖动旋转视角 · 滚轮缩放 · 双击重置</div>

  <div class="btns">
    <button id="btnNight">🌙 傍晚</button>
    <button id="btnAuto">🎠 环绕</button>
    <button id="btnReset">定位</button>
  </div>
</div>

<div id="loading">
  <div class="cup">🧁</div>
  <div class="txt">正在烘焙场景…</div>
</div>
<div id="err">场景加载失败。请检查网络（需要加载 three.js），<br>或通过本地服务器打开本页面。</div>

<script type="module">
/* ============================================================
   甜蜜小屋 · Three.js 卡通小镇商店门口
   ------------------------------------------------------------
   结构：
   1. 渲染器 / 场景 / 相机 / 自写轨道控制
   2. 工具函数（几何体、材质、描边）
   3. 贴图（Canvas 手绘：招牌 / 橱窗 / 黑板 / 垫子…）
   4. 天空、光、云、星
   5. 地面与石板广场
   6. 店面建筑（带开洞的立面、屋顶瓦片、烟囱）
   7. 店铺细节（橱窗、门、雨棚、招牌、花箱、壁灯）
   8. 门口道具（长椅、木箱、单车、猫、路灯、立牌…）
   9. 远景（邻居房子、树、栅栏、飞鸟）
   10. 昼夜切换 + 动画
   ============================================================ */

/* ------------------------------------------------------------
   0. 载入 three.js（CDN 优先，本地 lib 兜底）
------------------------------------------------------------ */
let THREE;
try {
  THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
} catch (e) {
  try {
    THREE = await import('./lib/three.module.js');
  } catch (e2) {
    document.getElementById('loading').classList.add('hide');
    document.getElementById('err').style.display = 'flex';
    throw e2;
  }
}

/* ------------------------------------------------------------
   1. 渲染器 / 场景 / 相机
------------------------------------------------------------ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;

const scene = new THREE.Scene();
const FOG_DAY = new THREE.Color('#ffe6c4');
const FOG_NIGHT = new THREE.Color('#1d2544');
scene.fog = new THREE.Fog(FOG_DAY.clone(), 38, 128);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 600);

const world = new THREE.Group();
scene.add(world);

// 每帧动画回调收集器（必须在所有构建函数之前声明）
const updaters = [];

/* --- 极简轨道控制（自己写，避免额外依赖） --- */
const ctrl = {
  theta: 0.42, phi: 1.35, radius: 17.4,
  tTheta: 0.42, tPhi: 1.35, tRadius: 17.4,
  target: new THREE.Vector3(0, 3.05, 0.9),
  auto: false
};
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

let dragging = false, lastX = 0, lastY = 0;
const pointers = new Map();
let pinchDist = 0;

canvas.addEventListener('pointerdown', (e) => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) { dragging = true; lastX = e.clientX; lastY = e.clientY; }
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
  }
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchDist > 0) ctrl.tRadius = clamp(ctrl.tRadius * (pinchDist / d), 8, 36);
    pinchDist = d;
    return;
  }
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  ctrl.tTheta = clamp(ctrl.tTheta - dx * 0.0052, -1.15, 1.15);
  ctrl.tPhi = clamp(ctrl.tPhi - dy * 0.0042, 0.62, 1.44);
});
const endPointer = (e) => { pointers.delete(e.pointerId); if (pointers.size === 0) dragging = false; pinchDist = 0; };
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  ctrl.tRadius = clamp(ctrl.tRadius * (1 + Math.sign(e.deltaY) * 0.085), 8, 36);
}, { passive: false });
canvas.addEventListener('dblclick', () => resetView());

function resetView() {
  ctrl.tTheta = 0.42; ctrl.tPhi = 1.35; ctrl.tRadius = 17.4; ctrl.auto = false;
  document.getElementById('btnAuto').classList.remove('on');
}

/* ------------------------------------------------------------
   2. 工具函数
------------------------------------------------------------ */
let seed = 20261105;
function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
const rand = (a, b) => a + rnd() * (b - a);
const pick = (arr) => arr[Math.floor(rnd() * arr.length) % arr.length];

// 三阶卡通渐变贴图（Toon 分色）
function makeGradientMap(steps = 4) {
  const data = new Uint8Array(steps);
  for (let i = 0; i < steps; i++) data[i] = Math.round(((i + 1) / steps) * 255);
  const tex = new THREE.DataTexture(data, steps, 1, THREE.RedFormat);
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}
const gradientMap = makeGradientMap(4);

const matCache = new Map();
function toon(color, extra = {}) {
  const key = color + '|' + JSON.stringify(extra);
  if (matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshToonMaterial({ color: new THREE.Color(color), gradientMap, ...extra });
  matCache.set(key, m);
  return m;
}

const B = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const CY = (rt, rb, h, seg = 16, open = false) => new THREE.CylinderGeometry(rt, rb, h, seg, 1, open);
const SP = (r, seg = 14) => new THREE.SphereGeometry(r, seg, Math.max(6, Math.round(seg * 0.65)));

function M(geo, mat, x = 0, y = 0, z = 0, parent = world) {
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

// 卡通描边（反向外壳，按视距等比加粗）
const outlineMat = new THREE.ShaderMaterial({
  uniforms: { uThickness: { value: 0.0038 } },
  vertexShader: /* glsl */`
    uniform float uThickness;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vec3 n = normalize(normalMatrix * normal);
      float d = max(-mv.z, 0.001);
      mv.xyz += n * uThickness * d;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    void main() { gl_FragColor = vec4(0.16, 0.10, 0.07, 1.0); }`,
  side: THREE.BackSide
});
function outline(mesh) {
  const o = new THREE.Mesh(mesh.geometry, outlineMat);
  o.castShadow = false; o.receiveShadow = false; o.renderOrder = -1;
  mesh.add(o);
  return mesh;
}

// 两点之间的圆柱（做车架、绳子、支架）
const _up = new THREE.Vector3(0, 1, 0);
function tube(p1, p2, r, mat, parent = world, seg = 8) {
  const a = new THREE.Vector3(...p1), b = new THREE.Vector3(...p2);
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const mesh = new THREE.Mesh(CY(r, r, len, seg), mat);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(_up, dir.normalize());
  mesh.castShadow = true; mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

// 圆角片（用于雨棚波浪边）
function halfDisc(radius) {
  return new THREE.CircleGeometry(radius, 18, Math.PI, Math.PI);
}

/* ------------------------------------------------------------
   3. 颜色表 & Canvas 贴图
------------------------------------------------------------ */
const C = {
  cream: '#f8e6c9', creamMid: '#f0d9b6', creamDark: '#e6cba2',
  wood: '#b07a4c', woodDark: '#7d5232', woodLight: '#c8945f',
  iron: '#4d4a55', ironLight: '#6e6b79',
  roof: '#d2604a', roofDark: '#b14633',
  teal: '#4f8d83', tealDark: '#3a6b63',
  stone: '#ded3c1', stoneDark: '#c4b8a4',
  green: '#79b957', greenDark: '#5d9a41',
  pink: '#f2a0ac', yellow: '#f7c95c', white: '#fdfaf3',
  glass: '#d8f0ff', brick: '#c1795c', gold: '#e8bf62'
};

function canvasTexture(w, h, draw) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  draw(ctx, w, h);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

/* --- 店招：SWEET SHOP --- */
const signTex = canvasTexture(1200, 300, (ctx, w, h) => {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#c98f5e'); g.addColorStop(0.45, '#b87c4c'); g.addColorStop(1, '#a06a3e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  // 木纹
  ctx.globalAlpha = 0.16; ctx.strokeStyle = '#5d3a1f'; ctx.lineWidth = 2;
  for (let i = 0; i < 26; i++) {
    ctx.beginPath();
    const y = (i + 0.5) * h / 26;
    ctx.moveTo(0, y);
    for (let x = 0; x <= w; x += 60) ctx.lineTo(x, y + Math.sin(x * 0.012 + i) * 2.4);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // 外框
  ctx.strokeStyle = '#f6e4c6'; ctx.lineWidth = 9; ctx.strokeRect(16, 16, w - 32, h - 32);
  ctx.strokeStyle = '#7a4c2b'; ctx.lineWidth = 3; ctx.strokeRect(30, 30, w - 60, h - 60);
  // 挂环
  ctx.fillStyle = '#4d4a55';
  [[190, 0], [w - 190, 0]].forEach(([x]) => { ctx.beginPath(); ctx.arc(x, 30, 15, 0, Math.PI * 2); ctx.fill(); });
  // 主字
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 116px "Comic Sans MS", "Trebuchet MS", sans-serif';
  ctx.fillStyle = 'rgba(60,34,16,.45)';
  ctx.fillText('SWEET SHOP', w / 2 + 7, h / 2 - 26);
  ctx.fillStyle = '#fff8e9';
  ctx.fillText('SWEET SHOP', w / 2, h / 2 - 33);
  // 副字
  ctx.font = '600 40px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#ffe6bb';
  ctx.fillText('甜 蜜 小 屋  ·  B A K E R Y', w / 2, h / 2 + 76);
});

/* --- 橱窗内部：暖光面包店 --- */
const interiorTex = canvasTexture(1024, 640, (ctx, w, h) => {
  const g = ctx.createRadialGradient(w * 0.5, h * 0.35, 40, w * 0.5, h * 0.5, w * 0.78);
  g.addColorStop(0, '#ffe7bb'); g.addColorStop(0.55, '#f3c78a'); g.addColorStop(1, '#c68f57');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

  // 后墙条纹壁纸
  ctx.globalAlpha = 0.13;
  for (let x = 0; x < w; x += 64) { ctx.fillStyle = '#a86a3a'; ctx.fillRect(x, 0, 26, h * 0.8); }
  ctx.globalAlpha = 1;

  // 吊灯
  [0.24, 0.5, 0.76].forEach((p) => {
    const x = w * p, y = 96;
    ctx.strokeStyle = '#7a4a24'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, y - 16); ctx.stroke();
    const lg = ctx.createRadialGradient(x, y + 18, 4, x, y + 18, 90);
    lg.addColorStop(0, 'rgba(255,236,186,.95)'); lg.addColorStop(1, 'rgba(255,210,140,0)');
    ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(x, y + 18, 90, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff3d2';
    ctx.beginPath(); ctx.moveTo(x - 34, y + 26); ctx.quadraticCurveTo(x, y - 10, x + 34, y + 26); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffdf9a';
    ctx.beginPath(); ctx.arc(x, y + 30, 9, 0, Math.PI * 2); ctx.fill();
  });

  // 货架
  function shelf(y) {
    ctx.fillStyle = '#a9703f'; ctx.fillRect(60, y, w - 120, 16);
    ctx.fillStyle = 'rgba(90,52,24,.25)'; ctx.fillRect(60, y + 12, w - 120, 7);
  }
  const shelfY = [h * 0.5, h * 0.66, h * 0.81];
  shelfY.forEach(shelf);

  // 架子上的罐子/面包
  const jarColors = ['#e0745f', '#8fbf7e', '#e8b45a', '#f0d6b0', '#c98fc0'];
  for (let r = 0; r < 2; r++) {
    const y = shelfY[r];
    for (let i = 0; i < 11; i++) {
      const x = 100 + i * 78 + (r % 2) * 20;
      const cw = 34 + (i % 3) * 8, chh = 40 + (i % 4) * 9;
      ctx.fillStyle = 'rgba(70,40,20,.18)';
      ctx.beginPath(); ctx.ellipse(x + 2, y + 2, cw * 0.62, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = jarColors[(i + r * 3) % jarColors.length];
      ctx.beginPath();
      ctx.roundRect(x - cw / 2, y - chh, cw, chh, [cw * 0.28, cw * 0.28, 4, 4]);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.4)';
      ctx.beginPath(); ctx.roundRect(x - cw / 2 + 5, y - chh + 7, cw * 0.22, chh * 0.5, 3); ctx.fill();
      ctx.fillStyle = '#f7ecd8';
      ctx.fillRect(x - cw / 2 - 3, y - chh - 7, cw + 6, 9);
    }
  }
  // 底层：面包篮 + 蛋糕台
  for (let i = 0; i < 5; i++) {
    const x = 150 + i * 150, y = shelfY[2] - 8;
    ctx.fillStyle = '#c98d52';
    ctx.beginPath(); ctx.ellipse(x, y, 62, 20, 0, 0, Math.PI * 2); ctx.fill();
    for (let k = 0; k < 4; k++) {
      ctx.fillStyle = ['#e8b165', '#d99a4c', '#f0c37e', '#c9863d'][k % 4];
      ctx.beginPath(); ctx.ellipse(x - 34 + k * 22, y - 16 - (k % 2) * 6, 20, 13, -0.3, 0, Math.PI * 2); ctx.fill();
    }
  }
  // 蛋糕台
  const cx = w * 0.5, cy = shelfY[1] - 54;
  ctx.fillStyle = '#efe3cd'; ctx.beginPath(); ctx.ellipse(cx, cy + 54, 86, 16, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#d9c7ab'; ctx.fillRect(cx - 10, cy + 10, 20, 46);
  ctx.fillStyle = '#f7a9b6'; ctx.beginPath(); ctx.ellipse(cx, cy + 8, 62, 18, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fdf0e2'; ctx.beginPath(); ctx.ellipse(cx, cy - 4, 56, 16, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ef7f8f'; ctx.beginPath(); ctx.arc(cx, cy - 22, 10, 0, Math.PI * 2); ctx.fill();

  // 前景柜台
  const cg = ctx.createLinearGradient(0, h * 0.86, 0, h);
  cg.addColorStop(0, '#b1784a'); cg.addColorStop(1, '#8a5933');
  ctx.fillStyle = cg; ctx.fillRect(0, h * 0.88, w, h * 0.12);
  ctx.fillStyle = 'rgba(255,240,210,.35)'; ctx.fillRect(0, h * 0.88, w, 6);

  // 玻璃反光
  ctx.globalAlpha = 0.16; ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.moveTo(w * 0.02, h * 0.9); ctx.lineTo(w * 0.22, 0); ctx.lineTo(w * 0.32, 0); ctx.lineTo(w * 0.12, h * 0.9); ctx.fill();
  ctx.beginPath(); ctx.moveTo(w * 0.36, h * 0.9); ctx.lineTo(w * 0.5, 0); ctx.lineTo(w * 0.55, 0); ctx.lineTo(w * 0.41, h * 0.9); ctx.fill();
  ctx.globalAlpha = 1;
});

/* --- 侧挂招牌：纸杯蛋糕 --- */
const bladeTex = canvasTexture(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#f7e3c2';
  ctx.beginPath(); ctx.roundRect(0, 0, w, h, 46); ctx.fill();
  ctx.strokeStyle = '#c8553f'; ctx.lineWidth = 16;
  ctx.beginPath(); ctx.roundRect(16, 16, w - 32, h - 32, 36); ctx.stroke();
  ctx.strokeStyle = '#e2b170'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.roundRect(34, 34, w - 68, h - 68, 28); ctx.stroke();
  // 杯子
  const cx = w / 2, cy = h * 0.52;
  ctx.fillStyle = '#e07b5f';
  ctx.beginPath(); ctx.moveTo(cx - 96, cy + 6); ctx.lineTo(cx + 96, cy + 6);
  ctx.lineTo(cx + 68, cy + 140); ctx.quadraticCurveTo(cx, cy + 168, cx - 68, cy + 140); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 16;
  for (let i = -4; i < 5; i++) { ctx.beginPath(); ctx.moveTo(cx + i * 44 - 40, cy); ctx.lineTo(cx + i * 44 + 40, cy + 170); ctx.stroke(); }
  ctx.restore();
  // 奶油
  ctx.fillStyle = '#fdf6ea';
  ctx.beginPath(); ctx.moveTo(cx - 104, cy + 8);
  ctx.bezierCurveTo(cx - 104, cy - 90, cx - 30, cy - 96, cx - 14, cy - 46);
  ctx.bezierCurveTo(cx + 10, cy - 120, cx + 104, cy - 80, cx + 104, cy + 8);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f6a6b4';
  ctx.beginPath(); ctx.arc(cx, cy - 96, 20, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#5eb17d';
  ctx.beginPath(); ctx.ellipse(cx + 26, cy - 110, 16, 8, -0.5, 0, Math.PI * 2); ctx.fill();
  // 文字

// --- 屋顶 ---
const ROOF = { ridgeY: 8.22, ridgeZ: -2.85 };
function buildRoofSlope(eaveY, eaveZ, sign) {
  const ridge = new THREE.Vector3(0, ROOF.ridgeY, ROOF.ridgeZ);
  const eave = new THREE.Vector3(0, eaveY, eaveZ);
  const slopeVec = new THREE.Vector3().subVectors(eave, ridge);
  const len = slopeVec.length();
  const dirDown = slopeVec.clone().normalize();
  const center = ridge.clone().add(eave).multiplyScalar(0.5);
  const W = 11.2;

  // 斜面板
  const panel = new THREE.Mesh(B(W, 0.22, len + 0.1), toon(C.roofDark));
  panel.position.copy(center);
  panel.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dirDown);
  panel.castShadow = true; panel.receiveShadow = true;
  world.add(panel);

  // 法线
  const normal = new THREE.Vector3().crossVectors(dirDown, new THREE.Vector3(1, 0, 0)).multiplyScalar(sign);

  // 瓦楞（实例化圆柱）
  const ribGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.62, 8);
  const cols = 26, rows = Math.max(6, Math.round(len / 0.44));
  const inst = new THREE.InstancedMesh(ribGeo, toon(C.roof), cols * rows);
  const dummy = new THREE.Object3D();
  const q = new THREE.Quaternion().setFromUnitVectors(_up, dirDown);
  const tmp = new THREE.Vector3();
  let i = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const u = -W / 2 + 0.22 + c * ((W - 0.44) / (cols - 1));
      const t = 0.28 + r * ((len - 0.5) / rows) + (c % 2) * 0.06;
      tmp.copy(ridge).addScaledVector(dirDown, t).addScaledVector(new THREE.Vector3(1, 0, 0), u).addScaledVector(normal, 0.11);
      dummy.position.copy(tmp);
      dummy.quaternion.copy(q);
      const s = 0.94 + (c % 3) * 0.02;
      dummy.scale.set(s, 1, s);
      dummy.updateMatrix();
      inst.setMatrixAt(i++, dummy.matrix);
    }
  }
  inst.castShadow = true; inst.receiveShadow = true;
  world.add(inst);

  // 檐口板
  const fascia = new THREE.Mesh(B(W + 0.1, 0.34, 0.2), toon(C.woodDark));
  fascia.position.set(0, eaveY - 0.12, eaveZ + sign * 0.04);
  fascia.castShadow = true;
  world.add(fascia);

  // 檐下托木
  for (let k = -4; k <= 4; k++) {
    const b = M(B(0.18, 0.42, 0.5), toon(C.wood), k * 1.15, eaveY - 0.28, eaveZ - sign * 0.22);
    b.rotation.x = sign * 0.3;
  }
}

function neighborHouse(x, z, w, h, d, wallColor, roofColor, ry = 0) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = ry;
  world.add(g);

  const b = M(B(w, h, d), toon(wallColor), 0, h / 2, 0, g);
  outline(b);

  // 四坡屋顶
  const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w, d) * 0.78, h * 0.42, 4), toon(roofColor));
  roof.position.y = h + h * 0.21;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  g.add(roof);

  // 窗户
  const wm = tintable(new THREE.MeshBasicMaterial({ color: '#cfe6f2' }), '#cfe6f2', '#ffd07a');
  const rows = h > 6 ? 2 : 1;
  for (let r = 0; r < rows; r++) {
    for (let i = -1; i <= 1; i++) {
      if (rnd() > 0.8) continue;
      const wx = i * w * 0.28;
      const wy = h * 0.35 + r * h * 0.32;
      const pane = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.16, h * 0.2), wm);
      pane.position.set(wx, wy, d / 2 + 0.05);
      g.add(pane);
      M(B(w * 0.2, h * 0.24, 0.06), toon('#f4ead8'), wx, wy, d / 2 + 0.005, g);
    }
  }
  // 门
  M(B(w * 0.16, h * 0.3, 0.08), toon(C.wood), 0, h * 0.15, d / 2 + 0.03, g);
  M(B(w * 0.2, 0.08, 0.34), toon(C.stone), 0, 0.04, d / 2 + 0.16, g);
  // 雨棚
  const aw = M(B(w * 0.34, 0.06, 0.7), toon(roofColor), 0, h * 0.33, d / 2 + 0.3, g);
  aw.rotation.x = 0.18;
  // 烟囱
  M(B(0.5, 2.0, 0.5), toon(C.brick), 0, h + h * 0.35, 0, g);
  M(B(0.62, 0.12, 0.62), toon('#a5624a'), 0, h + h * 0.35 + 1.05, 0, g);
  // 侧墙窗（朝 +X，面向镜头一侧）
  [-1, 1].forEach((k) => {
    const pane2 = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.16, h * 0.2), wm);
    pane2.position.set(w / 2 + 0.08, h * 0.45, k * d * 0.24);
    pane2.rotation.y = Math.PI / 2;
    g.add(pane2);
    M(B(0.06, h * 0.24, w * 0.2), toon('#f4ead8'), w / 2 + 0.03, h * 0.45, k * d * 0.24, g);
    M(B(0.05, h * 0.21, 0.3), toon(C.teal), w / 2 + 0.09, h * 0.45, k * (d * 0.24 + 0.62), g);
  });
  // 窗下花箱
  M(B(w * 0.24, 0.16, 0.2), toon(C.wood), -w * 0.28, h * 0.35 - h * 0.13, d / 2 + 0.11, g);
  for (let i = 0; i < 5; i++) {
    M(SP(0.06, 8), toon(pick(flowerColors)), -w * 0.28 - w * 0.1 + i * w * 0.05, h * 0.35 - h * 0.07, d / 2 + 0.13, g);
  }
  return g;
}

  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.scale.setScalar(s);
  world.add(g);
  const trunk = M(CY(0.14, 0.22, 2.0, 8), toon(C.wood), 0, 1.0, 0, g);
  outline(trunk);
  const blobs = 5;
  for (let i = 0; i < blobs; i++) {
    const a = (i / blobs) * Math.PI * 2;
    const r = i === 0 ? 0 : rand(0.5, 0.85);
    const b = M(SP(rand(0.7, 0.95) * (i === 0 ? 1.15 : 1), 12),
      toon(i % 2 ? leafColor : C.greenDark),
      Math.cos(a) * r, 2.15 + Math.sin(a) * r * 0.4 + rand(-0.1, 0.35), Math.sin(a) * r * 0.6, g);
    b.castShadow = true;
  }
  updaters.push((t) => {
    g.rotation.z = Math.sin(t * 0.6 + x) * 0.012;
  });
  return g;
}
tree(-9.4, -0.8, 1.15, '#6fb04f');
tree(9.8, 0.2, 1.0, '#7dbb56');
tree(-15.0, 4.8, 0.85, '#86c25c');
tree(15.2, 5.2, 0.9, '#6aa94a');
tree(-22, -2, 1.1, '#74b352');
tree(23, -1, 1.2, '#7ab955');

// 白色栅栏
function fence(x0, x1, z) {
  const g = new THREE.Group();
  world.add(g);
  const n = Math.round((x1 - x0) / 0.34);
  for (let i = 0; i <= n; i++) {
    const x = x0 + i * 0.34;
    const p = M(B(0.09, 0.9, 0.06), toon('#f6efe1'), x, 0.45, z, g);
    p.position.y = 0.45;
    // 尖头
    const tip = new THREE.Mesh(new THREE.ConeGeometry(0.075, 0.14, 4), toon('#f6efe1'));
    tip.position.set(x, 0.96, z);
    tip.rotation.y = Math.PI / 4;
    tip.castShadow = true;
    g.add(tip);
  }
  M(B(x1 - x0, 0.08, 0.05), toon('#f6efe1'), (x0 + x1) / 2, 0.66, z + 0.02, g);
  M(B(x1 - x0, 0.08, 0.05), toon('#f6efe1'), (x0 + x1) / 2, 0.28, z + 0.02, g);
}
fence(-13.5, -7.6, 6.2);
fence(8.6, 14.5, 6.0);

// 飞鸟
const birds = [];
{
  const birdMat = toon('#4a4550');
  for (let i = 0; i < 5; i++) {
    const g = new THREE.Group();
    const wingGeo = B(0.5, 0.03, 0.14);
    const l = new THREE.Mesh(wingGeo, birdMat);
    l.position.x = -0.26;
    const r = new THREE.Mesh(wingGeo, birdMat);
    r.position.x = 0.26;
    g.add(l, r);
    g.userData = { l, r, phase: rand(0, 6.28), radius: rand(16, 30), y: rand(16, 24), speed: rand(0.12, 0.22) };
    scene.add(g);
    birds.push(g);
  }
}

/* ------------------------------------------------------------
   10. 昼夜 & 动画
------------------------------------------------------------ */
let night = false;
let blend = 0, targetBlend = 0;

const DAY_SUN = new THREE.Color('#fff0d2'), NIGHT_SUN = new THREE.Color('#8fa6db');
const DAY_HEMI_SKY = new THREE.Color('#dff3ff'), NIGHT_HEMI_SKY = new THREE.Color('#2a3560');
const DAY_HEMI_GND = new THREE.Color('#c3ae8c'), NIGHT_HEMI_GND = new THREE.Color('#2a2a3e');
const FILL_DAY = new THREE.Color('#bcd8ff'), FILL_NIGHT = new THREE.Color('#5566aa');

function applyTime(b) {
  skyMat.uniforms.topColor.value.copy(SKY.dayTop).lerp(SKY.nightTop, b);
  skyMat.uniforms.bottomColor.value.copy(SKY.dayBot).lerp(SKY.nightBot, b);
  scene.fog.color.copy(FOG_DAY).lerp(FOG_NIGHT, b);

  sun.intensity = 2.45 * (1 - b) + 0.32 * b;
  sun.color.copy(DAY_SUN).lerp(NIGHT_SUN, b);
  sun.position.set(11 - 6 * b, 16 - 4 * b, 12 - 6 * b);

  hemi.intensity = 1.15 * (1 - b) + 0.42 * b;
  ambient.intensity = 0.3 * (1 - b) + 0.1 * b;
  hemi.color.copy(DAY_HEMI_SKY).lerp(NIGHT_HEMI_SKY, b);
  hemi.groundColor.copy(DAY_HEMI_GND).lerp(NIGHT_HEMI_GND, b);

  fill.intensity = 0.5 * (1 - b) + 0.18 * b;
  fill.color.copy(FILL_DAY).lerp(FILL_NIGHT, b);

  starMat.opacity = b * 0.95;
  moon.material.opacity = b;
  moonGlow.material.opacity = b * 0.85;

  for (const l of lampLights) l.intensity = 12 * b;
  for (const s of glows) s.material.opacity = 0.1 + 0.5 * b;

  for (const t of tintables) t.mat.color.copy(t.day).lerp(t.night, b);
}

// 烟囱炊烟
const smokes = [];
{
  const smokeMat = new THREE.MeshToonMaterial({ color: '#f2f0ea', gradientMap, transparent: true, opacity: 0.85 });
  for (let i = 0; i < 7; i++) {
    const s = new THREE.Mesh(SP(0.3, 10), smokeMat.clone());
    s.position.set(3.45, 9.45, -2.05);
    s.userData = { t: i / 7, seed: rand(0, 1) };
    s.castShadow = false;
    scene.add(s);
    smokes.push(s);
  }
}

// 漂浮光尘
{
  const dustGeo = new THREE.BufferGeometry();
  const pos = [];
  for (let i = 0; i < 220; i++) {
    pos.push(rand(-14, 14), rand(0.5, 9), rand(-6, 12));
  }
  dustGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
    color: 0xfff4d6, size: 0.085, transparent: true, opacity: 0.55, depthWrite: false
  }));
  scene.add(dust);
  updaters.push((t) => {
    const p = dustGeo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      let y = p.getY(i) + 0.0022;
      if (y > 9.5) y = 0.4;
      p.setY(i, y);
      p.setX(i, p.getX(i) + Math.sin(t * 0.6 + i) * 0.0015);
    }
    p.needsUpdate = true;
    dust.material.opacity = 0.25 + 0.5 * blend;
  });
}

// 时钟
const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  // 昼夜过渡
  blend += (targetBlend - blend) * Math.min(1, dt * 2.6);
  applyTime(blend);

  // 相机
  if (ctrl.auto) ctrl.tTheta = Math.sin(elapsed * 0.22) * 0.9;
  const k = Math.min(1, dt * 7);
  ctrl.theta += (ctrl.tTheta - ctrl.theta) * k;
  ctrl.phi += (ctrl.tPhi - ctrl.phi) * k;
  ctrl.radius += (ctrl.tRadius - ctrl.radius) * k;
  const sp = Math.sin(ctrl.phi), cp = Math.cos(ctrl.phi);
  camera.position.set(
    ctrl.target.x + ctrl.radius * sp * Math.sin(ctrl.theta),
    ctrl.target.y + ctrl.radius * cp,
    ctrl.target.z + ctrl.radius * sp * Math.cos(ctrl.theta)
  );
  camera.lookAt(ctrl.target);

  // 云飘动
  clouds.forEach((c, i) => {
    c.position.x += dt * (0.26 + i * 0.05);
    if (c.position.x > 95) c.position.x = -95;
  });

  // 飞鸟
  birds.forEach((b, i) => {
    const u = b.userData;
    const a = elapsed * u.speed + u.phase;
    b.position.set(Math.cos(a) * u.radius, u.y + Math.sin(a * 2) * 1.2, -30 + Math.sin(a) * u.radius * 0.4);
    b.rotation.y = -a;
    const flap = Math.sin(elapsed * 9 + u.phase) * 0.6;
    u.l.rotation.z = flap;
    u.r.rotation.z = -flap;
  });

  // 炊烟
  smokes.forEach((s) => {
    s.userData.t += dt * 0.18;
    const p = s.userData.t % 1;
    s.position.y = 9.42 + p * 4.2;
    s.position.x = 3.45 + Math.sin(p * 4 + s.userData.seed * 6) * 0.5;
    s.position.z = -2.05 + Math.cos(p * 3.4 + s.userData.seed * 4) * 0.45;
    const sc = 0.5 + p * 1.5;
    s.scale.setScalar(sc);
    s.material.opacity = (1 - p) * 0.55;
  });

  // 自定义动画
  for (const fn of updaters) fn(elapsed, dt);

  renderer.render(scene, camera);
}

------------------------------------------------------------ */
document.getElementById('btnNight').addEventListener('click', (e) => {
  night = !night;
  targetBlend = night ? 1 : 0;
  e.currentTarget.textContent = night ? '☀️ 清晨' : '🌙 傍晚';
  e.currentTarget.classList.toggle('on', night);
});
document.getElementById('btnAuto').addEventListener('click', (e) => {
  ctrl.auto = !ctrl.auto;
  e.currentTarget.classList.toggle('on', ctrl.auto);
});
document.getElementById('btnReset').addEventListener('click', resetView);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// 支持 #night 直达傍晚（方便分享/测试）
if (location.hash.toLowerCase().includes('night')) {
  night = true; targetBlend = 1; blend = 1;
  const b = document.getElementById('btnNight');
  b.textContent = '☀️ 清晨';
  b.classList.add('on');
}
applyTime(blend);
animate();

setTimeout(() => document.getElementById('loading').classList.add('hide'), 380);

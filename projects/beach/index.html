<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Summer Dusk</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #16101d; }
  canvas { display: block; }
  #veil {
    position: fixed; inset: 0; background: #16101d; z-index: 9;
    transition: opacity 1s ease;
  }
  #veil.off { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="veil"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   0. 基础
   ============================================================ */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.22;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(22, window.innerWidth / window.innerHeight, 0.5, 600);

// 视角参数（可用 ?az=135&polar=38&dist=56 调试）
const QS = new URLSearchParams(location.search);
const AZ = parseFloat(QS.get('az') || '45');
const POLAR = parseFloat(QS.get('polar') || '37');
// 按水平视场角反算取景距离：底座对角线 28.3 需完整入画，竖屏自动退远
const ASPECT = window.innerWidth / window.innerHeight;
const VFOV = THREE.MathUtils.degToRad(22);
const FIT_DIST = THREE.MathUtils.clamp(86 / ASPECT, 44, 112);
const DIST = parseFloat(QS.get('dist') || String(FIT_DIST));
const TARGET = new THREE.Vector3(0.2, 2.0, -1.0);

(function placeCamera() {
  const a = THREE.MathUtils.degToRad(AZ);
  const p = THREE.MathUtils.degToRad(POLAR);
  camera.position.set(
    TARGET.x + Math.cos(a) * Math.cos(p) * DIST,
    TARGET.y + Math.sin(p) * DIST,
    TARGET.z + Math.sin(a) * Math.cos(p) * DIST
  );
})();

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.rotateSpeed = 0.75;
controls.zoomSpeed = 0.8;
controls.minDistance = 26;
controls.maxDistance = Math.max(95, DIST * 1.3);
controls.minPolarAngle = 0.18;
controls.maxPolarAngle = Math.PI * 0.46;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
controls.enablePan = false;

/* ============================================================
   1. 纹理工具
   ============================================================ */
function canvasTexture(w, h, draw, repeatX = 1, repeatY = 1) {
  const cv = document.createElement('canvas');
  cv.width = w;
  cv.height = h;
  const ctx = cv.getContext('2d');
  draw(ctx, w, h);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeatX, repeatY);
  return tex;
}

// 木纹（底座侧面）
const woodTex = canvasTexture(512, 128, (ctx, w, h) => {
  ctx.fillStyle = '#6b4a34';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 90; i++) {
    const y = Math.random() * h;
    ctx.strokeStyle = `rgba(${30 + Math.random() * 40}, ${14 + Math.random() * 20}, ${6 + Math.random() * 12}, ${0.06 + Math.random() * 0.14})`;
    ctx.lineWidth = 0.6 + Math.random() * 2.4;
    ctx.beginPath();
    ctx.moveTo(0, y);
    for (let x = 0; x <= w; x += 16) {
      ctx.lineTo(x, y + Math.sin(x * 0.03 + i) * 3);
    }
    ctx.stroke();
  }
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, 'rgba(255,220,180,0.16)');
  g.addColorStop(0.5, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.28)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
}, 3, 1);

// 沥青
const asphaltTex = canvasTexture(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#5a565e';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) {
    const v = Math.random();
    ctx.fillStyle = `rgba(${v > 0.5 ? 255 : 0}, ${v > 0.5 ? 255 : 0}, ${v > 0.5 ? 255 : 0}, ${Math.random() * 0.05})`;
    ctx.fillRect(Math.random() * w, Math.random() * h, 2, 2);
  }
}, 6, 2);

// 人行道地砖
const tileTex = canvasTexture(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#cfc6ba';
  ctx.fillRect(0, 0, w, h);
  const n = 4;
  const s = w / n;
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      const v = 198 + Math.random() * 26;
      ctx.fillStyle = `rgb(${v}, ${v - 6}, ${v - 16})`;
      ctx.fillRect(i * s + 1.5, j * s + 1.5, s - 3, s - 3);
    }
  }
  ctx.strokeStyle = 'rgba(150,140,128,0.5)';
  ctx.lineWidth = 2;
  for (let i = 0; i <= n; i++) {
    ctx.beginPath(); ctx.moveTo(i * s, 0); ctx.lineTo(i * s, h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * s); ctx.lineTo(w, i * s); ctx.stroke();
  }
}, 4, 4);

// 招牌
const signTex = canvasTexture(1024, 232, (ctx, w, h) => {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#11405c');
  g.addColorStop(1, '#08202f');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  ctx.strokeStyle = '#5fe3f5';
  ctx.lineWidth = 10;
  ctx.strokeRect(7, 7, w - 14, h - 14);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = '#4fd8f0';
  ctx.shadowBlur = 36;
  ctx.font = 'bold 104px "Helvetica Neue", Arial, sans-serif';
  ctx.fillText('SEA MART', w / 2, h / 2 - 16);

  ctx.shadowBlur = 16;
  ctx.fillStyle = '#8ff0ff';
  ctx.font = 'bold 40px Arial, sans-serif';
  ctx.fillText('OPEN 24 HOURS', w / 2, h / 2 + 74);
});

// 贩卖机面板
const vendTex = canvasTexture(256, 512, (ctx, w, h) => {
  ctx.fillStyle = '#f4f7fa';
  ctx.fillRect(0, 0, w, h);

  // 顶部灯箱
  ctx.fillStyle = '#2ec4d8';
  ctx.fillRect(0, 0, w, 66);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 34px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('DRINK', w / 2, 34);

  // 商品格
  const cols = 4, rows = 4;
  const gx = 16, gy = 88, gw = (w - 32) / cols, gh = 78;
  const colors = ['#e8524a', '#f0a93b', '#3fa9e0', '#5fbf7a', '#c86ec4', '#f2d14b', '#e07a3a', '#4fb8c4'];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      ctx.fillStyle = '#e6ecf2';
      ctx.fillRect(gx + c * gw + 4, gy + r * gh + 4, gw - 8, gh - 12);
      ctx.fillStyle = colors[(r * cols + c) % colors.length];
      ctx.fillRect(gx + c * gw + 12, gy + r * gh + 12, gw - 24, gh - 32);
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillRect(gx + c * gw + 16, gy + r * gh + 48, gw - 40, 5);
    }
  }

  // 出货口
  ctx.fillStyle = '#2b3339';
  ctx.fillRect(24, h - 96, w - 48, 52);
});

// 伞面条纹
const stripeTex = canvasTexture(256, 64, (ctx, w, h) => {
  const cols = ['#f7f1e4', '#d8524a'];
  const n = 8;
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = cols[i % 2];
    ctx.fillRect(i * (w / n), 0, w / n, h);
  }
}, 1, 1);

// 雨棚条纹
const awningTex = canvasTexture(256, 128, (ctx, w, h) => {
  const cols = ['#f2ece0', '#3f9fb8'];
  const n = 6;
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = cols[i % 2];
    ctx.fillRect(i * (w / n), 0, w / n, h);
  }
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, 'rgba(0,0,0,0.12)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
});

// 沙
const sandTex = canvasTexture(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#e8d3ab';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 6000; i++) {
    const v = Math.random();
    ctx.fillStyle = `rgba(${v > 0.5 ? 255 : 120}, ${v > 0.5 ? 245 : 100}, ${v > 0.5 ? 220 : 70}, ${Math.random() * 0.16})`;
    ctx.fillRect(Math.random() * w, Math.random() * h, 2, 2);
  }
}, 8, 8);

/* ============================================================
   2. 天空 & 环境
   ============================================================ */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    uTop: { value: new THREE.Color(0x1e1734) },
    uMid: { value: new THREE.Color(0x7d4757) },
    uHorizon: { value: new THREE.Color(0xdf8a5f) },
    uBottom: { value: new THREE.Color(0x1d1220) },
    uSunDir: { value: new THREE.Vector3(-0.68, 0.34, -0.55).normalize() }
  },
  vertexShader: /* glsl */`
    varying vec3 vWorld;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorld = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */`
    uniform vec3 uTop;
    uniform vec3 uMid;
    uniform vec3 uHorizon;
    uniform vec3 uBottom;
    uniform vec3 uSunDir;
    varying vec3 vWorld;

    void main() {
      vec3 dir = normalize(vWorld);
      float h = dir.y;
      vec3 col = mix(uHorizon, uMid, smoothstep(0.0, 0.46, h));
      col = mix(col, uTop, smoothstep(0.38, 1.0, h));
      col = mix(uBottom, col, smoothstep(-0.55, 0.02, h));

      // 太阳方向的暖光晕
      float sa = max(0.0, dot(dir, normalize(uSunDir)));
      col += vec3(0.30, 0.14, 0.06) * pow(sa, 3.0) * 0.5;
      col += vec3(0.55, 0.28, 0.12) * pow(sa, 16.0);

      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(240, 40, 24), skyMat);
scene.add(sky);

// 太阳
const sunDir = new THREE.Vector3(-0.68, 0.34, -0.55).normalize();
const sunDisc = new THREE.Mesh(
  new THREE.CircleGeometry(9, 40),
  new THREE.MeshBasicMaterial({ color: 0xffd9a0, toneMapped: false, transparent: true, opacity: 0.95 })
);
sunDisc.position.copy(sunDir.clone().multiplyScalar(180));
sunDisc.lookAt(0, 0, 0);
scene.add(sunDisc);

const sunGlowMat = new THREE.MeshBasicMaterial({
  color: 0xffb066, transparent: true, opacity: 0.35,
  blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false
});
for (let i = 0; i < 3; i++) {
  const s = 20 + i * 16;
  const glow = new THREE.Mesh(new THREE.CircleGeometry(s, 40), sunGlowMat.clone());
  glow.material.opacity = 0.16 - i * 0.045;
  glow.position.copy(sunDir.clone().multiplyScalar(179 - i * 0.5));
  glow.lookAt(0, 0, 0);
  scene.add(glow);
}

// 环境贴图
function makeEnv() {
  const cv = document.createElement('canvas');
  cv.width = 64; cv.height = 128;
  const ctx = cv.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 128);
  g.addColorStop(0.00, '#2b2350');
  g.addColorStop(0.34, '#6d4a68');
  g.addColorStop(0.46, '#c8785f');
  g.addColorStop(0.50, '#ffb37a');
  g.addColorStop(0.54, '#5b6a70');
  g.addColorStop(1.00, '#22313a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 128);
  const tex = new THREE.CanvasTexture(cv);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  const pmrem = new THREE.PMREMGenerator(renderer);
  const rt = pmrem.fromEquirectangular(tex);
  pmrem.dispose();
  tex.dispose();
  return rt.texture;
}
scene.environment = makeEnv();

/* ============================================================
   3. 灯光
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xb0a0b8, 0xa06a42, 0.58);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffb877, 4.4);
sun.position.copy(sunDir).multiplyScalar(45);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -15;
sun.shadow.camera.right = 15;
sun.shadow.camera.top = 15;
sun.shadow.camera.bottom = -15;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 110;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.06;
scene.add(sun);

const skyFill = new THREE.DirectionalLight(0x8fa6d8, 0.3);
skyFill.position.set(12, 16, 20);
scene.add(skyFill);

const bounce = new THREE.DirectionalLight(0xffd2a8, 0.75);
bounce.position.set(20, 12, 22);
scene.add(bounce);

/* ============================================================
   4. 底座
   ============================================================ */
const BOARD = 20;
const HALF_B = BOARD / 2;

function roundedRectShape(size, r) {
  const s = size / 2;
  const sh = new THREE.Shape();
  sh.moveTo(-s + r, -s);
  sh.lineTo(s - r, -s);
  sh.quadraticCurveTo(s, -s, s, -s + r);
  sh.lineTo(s, s - r);
  sh.quadraticCurveTo(s, s, s - r, s);
  sh.lineTo(-s + r, s);
  sh.quadraticCurveTo(-s, s, -s, s - r);
  sh.lineTo(-s, -s + r);
  sh.quadraticCurveTo(-s, -s, -s + r, -s);
  return sh;
}

// 木质底托
(function buildPlinth() {
  const geo = new THREE.ExtrudeGeometry(roundedRectShape(BOARD, 0.34), {
    depth: 1.15, bevelEnabled: true,
    bevelThickness: 0.07, bevelSize: 0.07, bevelSegments: 2, curveSegments: 10
  });
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.MeshStandardMaterial({
    map: woodTex, color: 0xcdaa8c, roughness: 0.62, metalness: 0.08
  });
  const mesh = new THREE.Mesh(geo, mat);
  // ExtrudeGeometry 向 +y 延伸 (depth + 2*bevel)，下沉使顶面落在 y=0
  mesh.position.y = -(1.15 + 0.07);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
})();

// 顶面地形基板
(function buildDeck() {
  const geo = new THREE.ExtrudeGeometry(roundedRectShape(BOARD - 0.12, 0.28), {
    depth: 0.08, bevelEnabled: true,
    bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 1, curveSegments: 10
  });
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.MeshStandardMaterial({ color: 0x9a8a74, roughness: 0.95, metalness: 0 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.y = 0.012 - (0.08 + 0.02);
  mesh.receiveShadow = true;
  scene.add(mesh);
})();

// 黄铜包边
(function buildTrim() {
  const mat = new THREE.MeshStandardMaterial({ color: 0xb08b52, roughness: 0.34, metalness: 0.95 });
  const t = 0.07;
  const len = BOARD + 0.02;
  const edges = [
    [0, -HALF_B, len, t],
    [0, HALF_B, len, t],
  ];
  for (const [x, z, w, d] of edges) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.06, 0.09), mat);
    m.position.set(x, -0.055, z);
    scene.add(m);
  }
  for (const side of [-1, 1]) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.06, len), mat);
    m.position.set(side * HALF_B, -0.055, 0);
    scene.add(m);
  }
})();

/* ============================================================
   5. 地面分区
   ============================================================ */
const LAYOUT = {
  seaFar: -10,
  seaNear: -4.8,
  sandNear: -2.0,
  plazaNear: 4.2,
  walkNear: 5.4,
  roadNear: 9.4
};

// 道路
(function buildRoad() {
  const road = new THREE.Mesh(
    new THREE.BoxGeometry(BOARD, 0.05, LAYOUT.roadNear - LAYOUT.walkNear),
    new THREE.MeshStandardMaterial({ map: asphaltTex, color: 0xffffff, roughness: 0.88, metalness: 0.03 })
  );
  road.position.set(0, 0.035, (LAYOUT.walkNear + LAYOUT.roadNear) / 2);
  road.receiveShadow = true;
  scene.add(road);

  // 中线虚线
  const lineMat = new THREE.MeshStandardMaterial({ color: 0xd6cdb8, roughness: 0.75 });
  for (let i = -9; i <= 9; i += 1.8) {
    const dash = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.012, 0.12), lineMat);
    dash.position.set(i, 0.066, 7.45);
    dash.receiveShadow = true;
    scene.add(dash);
  }

  // 斑马线
  for (let i = 0; i < 7; i++) {
    const st = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.012, 4.0), lineMat);
    st.position.set(-2.4 + i * 0.95, 0.066, 7.4);
    st.receiveShadow = true;
    scene.add(st);
  }

  // 路缘
  const curbMat = new THREE.MeshStandardMaterial({ color: 0xc8c0b2, roughness: 0.9 });
  const curb = new THREE.Mesh(new THREE.BoxGeometry(BOARD, 0.2, 0.16), curbMat);
  curb.position.set(0, 0.1, LAYOUT.walkNear + 0.02);
  curb.castShadow = true;
  curb.receiveShadow = true;
  scene.add(curb);
})();

// 人行道
(function buildWalk() {
  const walk = new THREE.Mesh(
    new THREE.BoxGeometry(BOARD, 0.18, LAYOUT.walkNear - LAYOUT.plazaNear),
    new THREE.MeshStandardMaterial({ map: tileTex, color: 0xb2a794, roughness: 0.9 })
  );
  walk.position.set(0, 0.09, (LAYOUT.plazaNear + LAYOUT.walkNear) / 2);
  walk.receiveShadow = true;
  walk.castShadow = true;
  scene.add(walk);
})();

// 广场 / 便利店地块
(function buildPlaza() {
  const plaza = new THREE.Mesh(
    new THREE.BoxGeometry(BOARD, 0.16, LAYOUT.plazaNear - LAYOUT.sandNear + 0.2),
    new THREE.MeshStandardMaterial({ map: tileTex, color: 0xb0a591, roughness: 0.92 })
  );
  plaza.position.set(0, 0.08, (LAYOUT.sandNear + LAYOUT.plazaNear) / 2);
  plaza.receiveShadow = true;
  plaza.castShadow = true;
  scene.add(plaza);
})();

/* ============================================================
   6. 沙滩与海
   ============================================================ */
(function buildSand() {
  const w = BOARD;
  const d = LAYOUT.sandNear - LAYOUT.seaNear;
  const geo = new THREE.PlaneGeometry(w, d, 40, 16);
  geo.rotateX(-Math.PI / 2);

  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const z = pos.getZ(i);
    const x = pos.getX(i);
    // z 从 -d/2（海侧）到 +d/2（内陆）
    const t = clamp((z + d / 2) / d, 0, 1);
    const base = 0.055 + Math.pow(t, 1.35) * 0.3;
    const ripple = Math.sin(x * 1.1 + z * 2.2) * 0.012 + Math.sin(x * 2.7 - z * 1.3) * 0.008;
    const dune = Math.sin(x * 0.45) * Math.cos(z * 0.8) * 0.03 * t;
    pos.setY(i, base + ripple + dune);
  }
  geo.computeVertexNormals();

  const sand = new THREE.Mesh(
    geo,
    new THREE.MeshStandardMaterial({ map: sandTex, color: 0xd2c3a4, roughness: 0.98, metalness: 0 })
  );
  sand.position.set(0, 0, (LAYOUT.seaNear + LAYOUT.sandNear) / 2);
  sand.receiveShadow = true;
  sand.castShadow = true;
  scene.add(sand);
})();

// 程序化水面法线：可平铺的分形值噪声高度场 + 梯度求法线。
// 用噪声而非几条正弦叠加，避免交叉波峰被眼睛识别成织网状规律的晶格。
const waveNormal = (() => {
  const S = 256;
  // 整数格哈希（同格同值），配合环绕索引即可四边无缝
  const hash = (i, j, seed) => {
    let n = (i * 374761393 + j * 668265263 + seed * 1442695041) | 0;
    n = (n ^ (n >>> 13)) * 1274126177;
    n = (n ^ (n >>> 16)) >>> 0;
    return (n % 65536) / 65536;
  };
  const noise = (x, y, period, seed) => {
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    const xf = x - xi;
    const yf = y - yi;
    const sx = xf * xf * (3 - 2 * xf);
    const sy = yf * yf * (3 - 2 * yf);
    const x0 = ((xi % period) + period) % period;
    const y0 = ((yi % period) + period) % period;
    const x1 = (x0 + 1) % period;
    const y1 = (y0 + 1) % period;
    const a = hash(x0, y0, seed);
    const b = hash(x1, y0, seed);
    const c = hash(x0, y1, seed);
    const d = hash(x1, y1, seed);
    const ab = a + (b - a) * sx;
    const cd = c + (d - c) * sx;
    return ab + (cd - ab) * sy;
  };
  // [格数, 振幅, 种子]
  const OCT = [[5, 0.54, 11], [10, 0.27, 27], [20, 0.12, 41]];

  const height = new Float32Array(S * S);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      let v = 0;
      for (let k = 0; k < OCT.length; k++) {
        const p = OCT[k][0];
        v += OCT[k][1] * noise((x / S) * p, (y / S) * p, p, OCT[k][2]);
      }
      height[y * S + x] = v;
    }
  }

  // 中央差分求梯度
  const dxs = new Float32Array(S * S);
  const dys = new Float32Array(S * S);
  let acc = 0;
  for (let y = 0; y < S; y++) {
    const yu = ((y - 1) + S) % S;
    const yd = (y + 1) % S;
    for (let x = 0; x < S; x++) {
      const xl = ((x - 1) + S) % S;
      const xr = (x + 1) % S;
      const i = y * S + x;
      dxs[i] = height[y * S + xr] - height[y * S + xl];
      dys[i] = height[yd * S + x] - height[yu * S + x];
      acc += dxs[i] * dxs[i] + dys[i] * dys[i];
    }
  }
  // 归一化到目标平均坡角，让波陡与倍频配置解耦，方便调强度
  const rms = Math.sqrt(acc / (S * S)) || 1e-6;
  const TILT = 0.115; // 平均坡度，越大波纹越碎越亮
  const k = TILT / rms;

  const cv = document.createElement('canvas');
  cv.width = S;
  cv.height = S;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(S, S);
  for (let i = 0; i < S * S; i++) {
    const nx = -dxs[i] * k;
    const ny = -dys[i] * k;
    const inv = 1 / Math.sqrt(nx * nx + ny * ny + 1);
    const o = i * 4;
    img.data[o] = (nx * inv * 0.5 + 0.5) * 255;
    img.data[o + 1] = (ny * inv * 0.5 + 0.5) * 255;
    img.data[o + 2] = (inv * 0.5 + 0.5) * 255;
    img.data[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  // 海面 20 × 5.2，按长宽比给 repeat 才能保持波纹各向同性
  t.repeat.set(2.1, 0.55);
  t.anisotropy = 4;
  return t;
})();

const foamLines = [];
const foamAlpha = canvasTexture(512, 128, (ctx, w, h) => {
  ctx.fillStyle = '#000000';

  // 一条柔和的白色浪带
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, 'rgba(255,255,255,0)');
  g.addColorStop(0.34, 'rgba(255,255,255,0.85)');
  g.addColorStop(0.72, 'rgba(255,255,255,0.68)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  // 横向碎浪
  for (let i = 0; i < 150; i++) {
    const y = h * (0.3 + Math.random() * 0.5);
    const x = Math.random() * w;
    const len = 14 + Math.random() * 66;
    ctx.strokeStyle = `rgba(255,255,255,${0.2 + Math.random() * 0.45})`;
    ctx.lineWidth = 1 + Math.random() * 2.5;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + len, y + (Math.random() - 0.5) * 6);
    ctx.stroke();
  }

  // 边缘泡沫团
  for (let i = 0; i < 110; i++) {
    const x = Math.random() * w;
    const y = h * (0.25 + Math.random() * 0.6);
    const r = 4 + Math.random() * 14;
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, `rgba(255,255,255,${0.25 + Math.random() * 0.5})`);
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
});

(function buildPoles() {
  const poleMat = new THREE.MeshStandardMaterial({ color: 0x8e8378, roughness: 0.9 });
  const wireMat = new THREE.MeshStandardMaterial({ color: 0x1e1e20, roughness: 0.9 });
  const tops = [];

  for (const [x, z, h] of [[7.6, 5.9, 5.4], [2.0, 5.9, 5.0]]) {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.16, h, 10), poleMat);
    pole.position.set(x, h / 2, z);
    pole.castShadow = true;
    scene.add(pole);

    const cross = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.08, 0.08), poleMat);
    cross.position.set(x, h - 0.35, z);
    cross.castShadow = true;
    scene.add(cross);

    tops.push(new THREE.Vector3(x, h - 0.32, z));

    const trans = new THREE.Mesh(
      new THREE.CylinderGeometry(0.15, 0.15, 0.34, 10),
      new THREE.MeshStandardMaterial({ color: 0x6d7278, roughness: 0.5, metalness: 0.5 })
    );
    trans.position.set(x + 0.28, h - 0.75, z);
    trans.castShadow = true;
    scene.add(trans);
  }

  // 电线
  const a = tops[0], b = tops[1];
  for (let w = 0; w < 3; w++) {
    const pts = [];
    const off = (w - 1) * 0.14;
    for (let i = 0; i <= 12; i++) {
      const t = i / 12;
      const sag = Math.sin(Math.PI * t) * 0.55;
      pts.push(new THREE.Vector3(
        a.x + (b.x - a.x) * t,
        a.y + (b.y - a.y) * t - sag + off,
        a.z + off * 0.4
      ));
    }
    const curve = new THREE.CatmullRomCurve3(pts);
    const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 26, 0.022, 4, false), wireMat);
    tube.castShadow = true;
    scene.add(tube);
  }

  // 从电杆拉到店面
  const pts = [];
  for (let i = 0; i <= 10; i++) {
    const t = i / 10;
    const sag = Math.sin(Math.PI * t) * 0.4;
    pts.push(new THREE.Vector3(
      2.0 + (STORE.cx + STORE.w / 2 - 2.0) * t,
      5.0 - 0.3 - sag,
      5.9 + (STORE.cz - 5.9) * t
    ));
  }
  const c2 = new THREE.CatmullRomCurve3(pts);
  const t2 = new THREE.Mesh(new THREE.TubeGeometry(c2, 22, 0.02, 4, false), wireMat);
  scene.add(t2);
})();

function buildPalm(x, z, height, bend, scale = 1) {
  const g = new THREE.Group();

  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8a6a4a, roughness: 0.95 });
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(bend * 0.2, height * 0.36, bend * 0.1),
    new THREE.Vector3(bend * 0.6, height * 0.7, bend * 0.24),
    new THREE.Vector3(bend, height, bend * 0.34)
  ]);
  const trunk = new THREE.Mesh(new THREE.TubeGeometry(curve, 16, 0.15, 8, false), trunkMat);
  trunk.castShadow = true;
  trunk.receiveShadow = true;
  g.add(trunk);

  const top = curve.getPoint(1);

  // 椰子
  const coconutMat = new THREE.MeshStandardMaterial({ color: 0x5c4326, roughness: 0.9 });
  for (let i = 0; i < 3; i++) {
    const c = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 6), coconutMat);
    const a = i * 2.1;
    c.position.set(top.x + Math.cos(a) * 0.18, top.y - 0.16, top.z + Math.sin(a) * 0.18);
    c.castShadow = true;
    g.add(c);
  }

  // 叶片
  const leafGeo = (() => {
    const geo = new THREE.PlaneGeometry(0.62, 3.0, 1, 10);
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const px = p.getX(i);
      const py = p.getY(i);
      const t = (py + 1.5) / 3.0;
      const z = t * 2.9;
      const droop = -Math.pow(t, 1.7) * 1.15;
      p.setXYZ(i, px * (1 - 0.62 * t), droop, z);
    }
    geo.computeVertexNormals();
    return geo;
  })();

  const leafMat = new THREE.MeshStandardMaterial({
    color: 0x477a3c, roughness: 0.85, side: THREE.DoubleSide
  });
  const leafMat2 = new THREE.MeshStandardMaterial({
    color: 0x356032, roughness: 0.85, side: THREE.DoubleSide
  });

  const n = 9;
  for (let i = 0; i < n; i++) {
    const leaf = new THREE.Mesh(leafGeo, i % 2 ? leafMat : leafMat2);
    const holder = new THREE.Group();
    holder.position.copy(top);
    holder.rotation.y = (i / n) * Math.PI * 2 + rand(-0.1, 0.1);
    leaf.rotation.x = rand(-0.12, 0.28);
    leaf.castShadow = true;
    holder.add(leaf);
    g.add(holder);
  }

  g.position.set(x, 0.22, z);
  g.scale.setScalar(scale);
  g.rotation.y = Math.random() * Math.PI * 2;
  scene.add(g);
  return g;
}

buildPalm(6.3, -3.6, 4.4, 0.9, 1.0);
buildPalm(8.4, -4.0, 3.6, -0.6, 0.86);
buildPalm(8.6, -6.6, 3.0, 0.5, 0.72);

// 草丛
(function buildGrass() {
  const count = 260;
  const geo = new THREE.ConeGeometry(0.055, 0.42, 4);
  geo.translate(0, 0.21, 0);
  const mat = new THREE.MeshStandardMaterial({ color: 0x8a9655, roughness: 0.95 });

  const inst = new THREE.InstancedMesh(geo, mat, count);
  const d = new THREE.Object3D();
  const c = new THREE.Color();

  const spots = [];
  // 沙滩与广场交界
  for (let i = 0; i < count * 0.7; i++) {
    spots.push([rand(-9.4, 9.4), rand(-2.25, -1.55)]);
  }
  // 店前零星
  for (let i = 0; i < count * 0.3; i++) {
    spots.push([rand(-9.4, -7.6), rand(0, 3.0)]);
  }

  for (let i = 0; i < count; i++) {
    const [x, z] = spots[i] || [0, 0];
    d.position.set(x, 0.12 + Math.random() * 0.1, z);
    d.rotation.set(rand(-0.2, 0.2), Math.random() * Math.PI, rand(-0.2, 0.2));
    d.scale.set(rand(0.7, 1.5), rand(0.7, 1.7), rand(0.7, 1.5));
    d.updateMatrix();
    inst.setMatrixAt(i, d.matrix);
    c.setHSL(rand(0.14, 0.22), rand(0.3, 0.5), rand(0.34, 0.5));
    inst.setColorAt(i, c);
  }
  inst.instanceMatrix.needsUpdate = true;
  if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
  inst.castShadow = true;
  scene.add(inst);
})();

// 沙滩遮阳伞

// 沙滩躺椅
function buildBeachChair(x, z, rot) {
  const g = new THREE.Group();
  const frameMat = new THREE.MeshStandardMaterial({ color: 0xc9b89a, roughness: 0.8 });
  const seatMat = new THREE.MeshStandardMaterial({ map: stripeTex, roughness: 0.9, side: THREE.DoubleSide });

  const seat = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.05, 1.15), seatMat);
  seat.position.set(0, 0.34, 0);
  seat.rotation.x = -0.12;
  seat.castShadow = true;
  g.add(seat);

  const back = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.05, 0.72), seatMat);
  back.position.set(0, 0.58, -0.78);
  back.rotation.x = 0.95;
  back.castShadow = true;
  g.add(back);

  for (const [lx, lz] of [[-0.28, 0.45], [0.28, 0.45], [-0.28, -0.55], [0.28, -0.55]]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.36, 0.05), frameMat);
    leg.position.set(lx, 0.18, lz);
    leg.castShadow = true;
    g.add(leg);
  }

  g.position.set(x, 0.2, z);
  g.rotation.y = rot;
  scene.add(g);
}
buildBeachChair(0.9, -3.5, 0.5);

// 沙滩小物
(function buildBeachProps() {
  const ball = new THREE.Mesh(

// 礁石
(function buildRocks() {
  const mat = new THREE.MeshStandardMaterial({ color: 0x6a6058, roughness: 0.95, flatShading: true });
  const spots = [[-7.4, -6.0, 0.5], [-6.2, -6.6, 0.34], [8.2, -6.4, 0.44], [6.6, -7.2, 0.28]];
  for (const [x, z, s] of spots) {
    const geo = new THREE.IcosahedronGeometry(s, 0);
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      p.setXYZ(i,
        p.getX(i) * rand(0.8, 1.25),
        p.getY(i) * rand(0.55, 0.9),
        p.getZ(i) * rand(0.8, 1.25)
      );
    }
    geo.computeVertexNormals();
    const rock = new THREE.Mesh(geo, mat);
    rock.position.set(x, rand(0.0, 0.1), z);
    rock.rotation.set(Math.random(), Math.random(), Math.random());
    rock.castShadow = true;
    rock.receiveShadow = true;
    scene.add(rock);
  }
})();

/* ============================================================
   10. 悬浮接触阴影
   ============================================================ */
(function buildContactShadow() {
  const tex = canvasTexture(256, 256, (ctx, w, h) => {
    const g = ctx.createRadialGradient(w / 2, h / 2, 10, w / 2, h / 2, w / 2);
    g.addColorStop(0, 'rgba(20,10,20,0.55)');
    g.addColorStop(0.55, 'rgba(20,10,20,0.28)');
    g.addColorStop(1, 'rgba(20,10,20,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  });
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;

  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(34, 34),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, toneMapped: false })
  );
  plane.rotation.x = -Math.PI / 2;
  plane.position.y = -3.4;
  scene.add(plane);
})();

/* ============================================================
   11. 后期
   ============================================================ */
const composer = new EffectComposer(renderer);
composer.setSize(window.innerWidth, window.innerHeight);

composer.addPass(new RenderPass(scene, camera));

const bokeh = new BokehPass(scene, camera, {
  focus: 52.0,
  aperture: 0.0016,
  maxblur: 0.0052
});
composer.addPass(bokeh);

const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.68, 0.62, 0.88
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ============================================================
   12. 动画
   ============================================================ */
const clock = new THREE.Clock();
const focusTarget = new THREE.Vector3();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  // 海面波动
  const pos = seaGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const ox = seaOrig[i * 3];
    const oz = seaOrig[i * 3 + 2];
    const y =
      Math.sin(ox * 1.15 + elapsed * 1.35) * 0.011 +
      Math.sin(oz * 2.4 - elapsed * 1.7) * 0.007 +
      Math.sin((ox + oz) * 0.9 + elapsed * 1.1) * 0.006;
    pos.setY(i, y);
  }
  pos.needsUpdate = true;
  seaGeo.computeVertexNormals();

  // 浪花推进
  for (const f of foamLines) {
    const p = f.userData.phase;
    const k = (Math.sin(elapsed * 0.9 + p) + 1) * 0.5;
    f.position.z = f.userData.baseZ + k * 0.5;
    f.material.opacity = 0.14 + k * 0.42;
    f.scale.x = 1 + k * 0.004;
  }

  waveNormal.offset.x = elapsed * 0.012;
  waveNormal.offset.y = elapsed * 0.007;

  controls.update();

  // 景深焦点跟随
  focusTarget.copy(controls.target);
  const dist = camera.position.distanceTo(focusTarget);
  if (bokeh.uniforms && bokeh.uniforms['focus']) {
    bokeh.uniforms['focus'].value = dist;
  }

  composer.render();
}

/* ============================================================
   13. 自适应 & 启动
   ============================================================ */
window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
});

animate();

// 开场：轻微推近 + 淡出遮罩
(function intro() {
  const start = camera.position.clone().multiplyScalar(1.18);
  const end = camera.position.clone();
  camera.position.copy(start);
  const t0 = performance.now();
  const dur = 2200;

  function step() {
    const k = Math.min(1, (performance.now() - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(start, end, e);
    if (k < 1) requestAnimationFrame(step);
  }
  step();

  setTimeout(() => {
    const veil = document.getElementById('veil');
    veil.classList.add('off');
    setTimeout(() => veil.remove(), 1200);
  }, 420);
})();

window.__ready = true;

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>郑州市中心 · 微缩沙盘 | ZHENGZHOU DIORAMA</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --ink:#2a2722;
    --ink2:#5f5749;
    --ink3:#8a8171;
    --line:rgba(70,58,42,.16);
    --paper:rgba(252,250,245,.86);
    --brass:#a3833c;
    --brass-l:#c9a860;
  }
  html,body{width:100%;height:100%;overflow:hidden;background:#e9e5db;
    font-family:"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);
    -webkit-font-smoothing:antialiased}
  #app{position:fixed;inset:0}
  #app canvas{display:block}

  .hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  .hud > *{pointer-events:auto}

  /* ---------- 展签标题 ---------- */
  .plate{position:absolute;top:42px;left:48px;max-width:360px}
  .plate .kicker{display:flex;align-items:center;gap:10px;font-size:9.5px;letter-spacing:.26em;
    color:var(--brass);font-weight:600;text-transform:uppercase}
  .plate .kicker::before{content:"";width:22px;height:1px;background:var(--brass);opacity:.8}
  .plate h1{margin-top:14px;font-family:"Songti SC","STSong","SimSun",serif;
    font-size:31px;line-height:1.28;letter-spacing:.10em;font-weight:700;color:#211e19}
  .plate h1 span{display:block;font-size:15px;letter-spacing:.42em;font-weight:400;
    color:var(--ink2);margin-top:7px;margin-left:2px}
  .plate .meta{display:flex;align-items:center;gap:9px;margin-top:15px;
    font-size:10.5px;letter-spacing:.14em;color:var(--ink3)}
  .plate .meta i{width:3px;height:3px;border-radius:50%;background:var(--ink3);opacity:.6}

  /* ---------- 地标索引 ---------- */
  .index{position:absolute;top:52px;right:46px;width:216px}
  .index-h{font-size:10px;letter-spacing:.24em;color:var(--brass);font-weight:600;
    padding-bottom:9px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
  .index-h em{font-style:normal;color:var(--ink3);letter-spacing:.12em;font-size:8.5px}
  #ixList{margin-top:3px}
  .ix{display:flex;align-items:baseline;gap:9px;width:100%;padding:7px 4px 7px 0;
    background:none;border:0;border-bottom:1px solid rgba(70,58,42,.07);
    font:inherit;color:var(--ink);cursor:pointer;text-align:left;
    transition:background .25s,color .25s,padding .25s;position:relative}
  .ix:hover{background:rgba(255,255,255,.55);padding-left:6px}
  .ix.active{background:rgba(255,255,255,.7);padding-left:6px}
  .ix.active .nm{color:var(--brass)}
  .ix .no{font-size:8.5px;color:var(--ink3);letter-spacing:.06em;font-variant-numeric:tabular-nums;
    width:14px;flex:0 0 auto}
  .ix .nm{font-size:12.5px;letter-spacing:.08em;flex:1 1 auto}
  .ix .h{font-size:9.5px;color:var(--ink3);font-variant-numeric:tabular-nums;letter-spacing:.02em}

  /* ---------- 图例 ---------- */
  .legend{position:absolute;left:48px;bottom:44px;width:236px}
  .lg-h{font-size:10px;letter-spacing:.24em;color:var(--brass);font-weight:600;
    padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:9px}
  .lg-row{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--ink2);
    letter-spacing:.06em;padding:4px 0}
  .sw{width:13px;height:6px;border-radius:1px;flex:0 0 auto;display:block}
  .sw-brass{background:linear-gradient(90deg,#c9a860,#8d7132)}
  .sw-cream{background:#e6e0d2;border:1px solid rgba(70,58,42,.22)}
  .sw-water{background:linear-gradient(90deg,#9dc2c4,#6f9fa4)}
  .sw-green{background:#b9c8a9;border:1px solid rgba(70,58,42,.15)}
  .lg-note{margin-top:11px;font-size:9.5px;line-height:1.85;color:var(--ink3);letter-spacing:.04em}

  /* ---------- 控件 ---------- */
  .ctrl{position:absolute;right:46px;bottom:44px;display:flex;flex-direction:column;
    align-items:flex-end;gap:10px}
  .ctrl .row{display:flex;gap:7px}
  .tg{font:inherit;font-size:10.5px;letter-spacing:.14em;padding:7px 13px;
    background:rgba(252,250,245,.72);border:1px solid var(--line);color:var(--ink3);
    cursor:pointer;backdrop-filter:blur(6px);transition:all .25s}
  .tg:hover{border-color:rgba(163,131,60,.5);color:var(--ink2)}
  .tg.on{background:rgba(163,131,60,.92);border-color:rgba(163,131,60,.92);color:#fdfaf3}
  .hint{font-size:9.5px;letter-spacing:.14em;color:var(--ink3);opacity:.85}

  /* ---------- 3D 展签 ---------- */
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  #leaders{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  #leaders line{stroke:rgba(120,100,60,.42);stroke-width:1}
  #leaders circle{fill:rgba(120,100,60,.55)}
  .pl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);
    padding:3px 8px 4px;background:rgba(253,251,246,.93);
    border:1px solid rgba(90,74,50,.20);white-space:nowrap;
    box-shadow:0 3px 10px -6px rgba(50,40,20,.55);
    transition:none}
  .pl b{display:block;font-size:10.5px;font-weight:600;letter-spacing:.10em;color:#2a2722}
  .pl i{display:block;font-style:normal;font-size:8px;letter-spacing:.10em;color:#8a8171;margin-top:1px}

  /* ---------- 信息卡 ---------- */
  .card{position:absolute;right:46px;bottom:126px;width:286px;padding:18px 20px 20px;
    background:var(--paper);border:1px solid var(--line);backdrop-filter:blur(14px);
    box-shadow:0 18px 48px -18px rgba(50,40,25,.35);
    opacity:0;transform:translateY(12px);pointer-events:none;
    transition:opacity .4s ease,transform .4s cubic-bezier(.2,.8,.2,1)}
  .card.show{opacity:1;transform:none;pointer-events:auto}
  .card-top{display:flex;justify-content:space-between;align-items:center;
    font-size:8.5px;letter-spacing:.2em;color:var(--brass);text-transform:uppercase}
  .card .close{background:none;border:0;font-size:17px;line-height:1;color:var(--ink3);
    cursor:pointer;padding:0 2px}
  .card h3{font-family:"Songti SC","STSong","SimSun",serif;font-size:19px;letter-spacing:.1em;
    margin:9px 0 12px;font-weight:700}
  .stats{display:flex;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:9px 0;margin-bottom:12px}
  .stats div{flex:1;border-right:1px solid var(--line);padding-left:9px}
  .stats div:first-child{padding-left:0}
  .stats div:last-child{border-right:0}
  .stats b{display:block;font-size:8.5px;letter-spacing:.16em;color:var(--ink3);
    font-weight:500;margin-bottom:3px}
  .stats span{font-size:12px;letter-spacing:.04em;color:var(--ink);font-variant-numeric:tabular-nums}
  .card p{font-size:11px;line-height:1.95;color:var(--ink2);letter-spacing:.04em}

  /* ---------- 入场 ---------- */
  #veil{position:fixed;inset:0;z-index:50;background:#ece8de;display:flex;
    align-items:center;justify-content:center;transition:opacity .9s ease .1s}
  #veil.gone{opacity:0;pointer-events:none}
  #veil .v-t{font-family:"Songti SC","STSong","SimSun",serif;font-size:13px;letter-spacing:.5em;
    color:var(--ink3);text-indent:.5em}
  #veil .v-l{margin-top:16px;width:120px;height:1px;background:rgba(70,58,42,.14);overflow:hidden;position:relative}
  #veil .v-l::after{content:"";position:absolute;inset:0;background:var(--brass);
    transform-origin:left;animation:load 1.5s cubic-bezier(.5,0,.2,1) forwards}
  @keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}

  @media (max-width:900px){
    .plate{top:26px;left:24px}
    .plate h1{font-size:23px}
    .index{display:none}
    .legend{bottom:24px;left:24px;width:170px}
    .ctrl{right:24px;bottom:24px}
    .card{right:24px;bottom:112px;width:250px}
  }
</style>
</head>
<body>
<div id="app"></div>

<div class="hud">
  <div id="labels"><svg id="leaders"></svg></div>
  <div class="plate">
    <div class="kicker">Micro Diorama · 城市微缩模型</div>
    <h1>郑州市中心<span>微 缩 沙 盘</span></h1>
    <div class="meta"><span>1 : 2000</span><i></i><span>底板 1.34 × 0.98 km</span><i></i><span>示意布局</span></div>
  </div>

  <aside class="index">
    <div class="index-h">地标索引 <em>LANDMARKS</em></div>
    <div id="ixList"></div>
  </aside>

  <div class="legend">
    <div class="lg-h">模型信息</div>
    <div class="lg-row"><b class="sw sw-brass"></b>地标构筑物</div>
    <div class="lg-row"><b class="sw sw-cream"></b>城市肌理（示意体块）</div>
    <div class="lg-row"><b class="sw sw-water"></b>水系 · 如意湖 / 金水河</div>
    <div class="lg-row"><b class="sw sw-green"></b>绿地 · 公园</div>
    <p class="lg-note">建筑高度按真实比例，平面距离为压缩示意。<br>细部仅作模型表达，非测绘图。</p>
  </div>

  <div class="ctrl">
    <div class="row">
      <button class="tg on" id="btnLabels">展签</button>
      <button class="tg on" id="btnRotate">巡游</button>
      <button class="tg on" id="btnDof">浅景深</button>
      <button class="tg" id="btnReset">复位</button>
    </div>
    <div class="hint">拖拽旋转 · 滚轮缩放 · 点击地标</div>
  </div>

  <article class="card" id="card">
    <div class="card-top"><span id="c-en"></span><button class="close" id="c-close">×</button></div>
    <h3 id="c-cn"></h3>
    <div class="stats">
      <div><b>高度</b><span id="c-h"></span></div>
      <div><b>建成</b><span id="c-y"></span></div>
      <div><b>定位</b><span id="c-t"></span></div>
    </div>
    <p id="c-d"></p>
  </article>
</div>

<div id="veil"><div><div class="v-t">正在铺装模型</div><div class="v-l"></div></div></div>

<script>
window.addEventListener('error', function (e) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;z-index:9999;left:0;top:0;right:0;padding:14px;background:#ffe9e6;color:#8c1d10;font:12px/1.6 monospace;white-space:pre-wrap';
  d.textContent = 'ERROR: ' + (e.message || '') + '  @' + (e.lineno || '');
  document.body.appendChild(d);
});

  d.style.cssText = 'position:fixed;z-index:9999;left:0;top:0;right:0;padding:14px;background:#ffe9e6;color:#8c1d10;font:12px/1.6 monospace;white-space:pre-wrap';
  d.textContent = 'REJECT: ' + (e.reason && e.reason.message || e.reason);
  document.body.appendChild(d);
});
</script>

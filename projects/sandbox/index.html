<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>像素沙盘模拟器</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#06080f;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#cfe0ff;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #c { display:block; position:fixed; inset:0; }

  .bar {
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    display:flex; gap:6px; padding:8px;
    background:rgba(14,22,44,.85);
    border:1px solid rgba(90,140,255,.2);
    border-radius:14px;
    backdrop-filter:blur(12px);
    box-shadow:0 8px 40px rgba(0,0,0,.5);
    z-index:10; flex-wrap:wrap; justify-content:center;
    max-width:calc(100vw - 28px);
  }
  .btn {
    padding:8px 14px; font-size:13px; font-weight:600;
    font-family:inherit; color:#cfe0ff;
    background:rgba(30,45,90,.6);
    border:1px solid rgba(90,140,255,.25);
    border-radius:9px; cursor:pointer;
    transition:all .15s;
    display:flex; align-items:center; gap:6px;
    white-space:nowrap;
  }
  .btn:hover { background:rgba(50,75,150,.6); }
  .btn.active {
    background:rgba(60,120,255,.35);
    border-color:rgba(130,180,255,.8);
    box-shadow:0 0 16px rgba(80,150,255,.4);
  }
  .dot {
    width:10px; height:10px; border-radius:50%;
    display:inline-block;
  }

  .ctrl {
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:14px;
    padding:8px 16px;
    background:rgba(14,22,44,.85);
    border:1px solid rgba(90,140,255,.2);
    border-radius:14px;
    backdrop-filter:blur(12px);
    z-index:10;
  }
  .ctrl label {
    font-size:12px; letter-spacing:.1em;
    color:rgba(170,200,255,.7);
  }
  input[type=range] {
    -webkit-appearance:none; appearance:none;
    width:120px; height:4px; border-radius:99px;
    background:rgba(90,140,255,.25);
    outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none;
    width:14px; height:14px; border-radius:50%;
    background:linear-gradient(135deg,#7cf,#a8f);
    box-shadow:0 0 10px rgba(120,180,255,.8);
    border:2px solid rgba(220,240,255,.9);
  }
  .val {
    font-size:12px; font-weight:700; color:#9fd0ff;
    min-width:20px; text-align:center;
    font-variant-numeric:tabular-nums;
  }

  .hint {
    position:fixed; bottom:70px; left:50%;
    transform:translateX(-50%);
    font-size:11px; letter-spacing:.15em;
    color:rgba(150,190,255,.35);
    pointer-events:none; z-index:5;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="bar" id="palette"></div>

<div class="ctrl">
  <label>笔刷</label>
  <input type="range" id="brush" min="1" max="20" value="5">
  <span class="val" id="brushVal">5</span>
  <button class="btn" id="pauseBtn">暂停</button>
  <button class="btn" id="clearBtn">清空</button>
</div>

<div class="hint">拖动鼠标绘制 · 空格暂停</div>

<script>
(() => {
'use strict';

/* ==================== 常量 ==================== */
const COLS = 200;
const ROWS = 150;

const EMPTY = 0, SAND = 1, WATER = 2, STONE = 3, WOOD = 4, FIRE = 5, SMOKE = 6, ACID = 7;

/* ==================== 数据 ==================== */
const grid = new Uint8Array(COLS * ROWS);
const life = new Uint8Array(COLS * ROWS);
const updated = new Uint8Array(COLS * ROWS);

const MATERIALS = [
  { id: SAND,  name: '沙子', color: [232, 200, 122], vary: 30 },
  { id: WATER, name: '水',   color: [58, 127, 200],  vary: 20 },
  { id: STONE, name: '石头', color: [122, 122, 122], vary: 35 },
  { id: WOOD,  name: '木头', color: [138, 90, 58],   vary: 25 },
  { id: FIRE,  name: '火',   color: [255, 140, 20],  vary: 0  },
  { id: ACID,  name: '酸液', color: [122, 255, 58],  vary: 25 },
];
const MAT_MAP = {};
for (const m of MATERIALS) MAT_MAP[m.id] = m;

let currentMat = SAND;
let brushSize = 5;
let paused = false;

/* ==================== 画布 ==================== */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 2);

const off = document.createElement('canvas');
off.width = COLS;
off.height = ROWS;
const offCtx = off.getContext('2d');
const imgData = offCtx.createImageData(COLS, ROWS);
const pixels = imgData.data;

let scale = 1, ox = 0, oy = 0;

function resize() {
  canvas.width = window.innerWidth * DPR;
  canvas.height = window.innerHeight * DPR;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';

  const sx = canvas.width / COLS;
  const sy = canvas.height / ROWS;
  scale = Math.max(1, Math.floor(Math.min(sx, sy)));
  ox = Math.floor((canvas.width - COLS * scale) / 2);
  oy = Math.floor((canvas.height - ROWS * scale) / 2);
}
resize();
window.addEventListener('resize', resize);

/* ==================== 工具 ==================== */
function hash(i) {
  let h = (i * 2654435761) >>> 0;
  h = Math.imul(h ^ (h >>> 16), 2246822507) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 3266489909) >>> 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}

function swap(a, b) {
  const t = grid[a]; grid[a] = grid[b]; grid[b] = t;
  const l = life[a]; life[a] = life[b]; life[b] = l;
  updated[a] = 1;
  updated[b] = 1;
}

/* ==================== 物理更新 ==================== */
function updateSand(x, y, idx) {
  if (y >= ROWS - 1) return;
  const below = idx + COLS;
  const b = grid[below];
  if (b === EMPTY || b === WATER || b === ACID) { swap(idx, below); return; }

  const dir = Math.random() < 0.5 ? -1 : 1;
  for (const dx of [dir, -dir]) {
    const nx = x + dx;
    if (nx < 0 || nx >= COLS) continue;
    const nidx = below + dx;
    const n = grid[nidx];
    if (n === EMPTY || n === WATER || n === ACID) { swap(idx, nidx); return; }
  }
}

function flowSideways(x, y, idx) {
  const dir = Math.random() < 0.5 ? -1 : 1;
  for (const dx of [dir, -dir]) {
    const nx = x + dx;
    if (nx < 0 || nx >= COLS) continue;
    if (grid[idx + dx] === EMPTY) { swap(idx, idx + dx); return; }
  }
}

function updateWater(x, y, idx) {
  if (y >= ROWS - 1) { flowSideways(x, y, idx); return; }
  const below = idx + COLS;
  if (grid[below] === EMPTY) { swap(idx, below); return; }

  const dir = Math.random() < 0.5 ? -1 : 1;
  for (const dx of [dir, -dir]) {
    const nx = x + dx;
    if (nx < 0 || nx >= COLS) continue;
    if (grid[below + dx] === EMPTY) { swap(idx, below + dx); return; }
  }
  flowSideways(x, y, idx);
}

function updateFire(x, y, idx) {
  life[idx]--;
  if (life[idx] <= 0) {
    if (Math.random() < 0.4) {
      grid[idx] = SMOKE;
      life[idx] = 40 + Math.random() * 40;
    } else {
      grid[idx] = EMPTY;
    }
    return;
  }

  // 点燃木头 / 被水熄灭
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
      const nidx = ny * COLS + nx;
      const n = grid[nidx];
      if (n === WOOD && Math.random() < 0.02) {
        grid[nidx] = FIRE;
        life[nidx] = 50 + Math.random() * 60;
        updated[nidx] = 1;
      } else if (n === WATER) {
        grid[idx] = SMOKE;
        life[idx] = 30;
        return;
      }
    }
  }

  // 上升
  if (y > 0) {
    const up = idx - COLS;
    if (grid[up] === EMPTY) { swap(idx, up); return; }
    const dir = Math.random() < 0.5 ? -1 : 1;
    for (const dx of [dir, -dir]) {
      const nx = x + dx;
      if (nx < 0 || nx >= COLS) continue;
      if (grid[up + dx] === EMPTY) { swap(idx, up + dx); return; }
    }
  }
}

function updateSmoke(x, y, idx) {
  life[idx]--;
  if (life[idx] <= 0) { grid[idx] = EMPTY; return; }
  if (y > 0) {
    const up = idx - COLS;
    if (grid[up] === EMPTY) { swap(idx, up); return; }
    const dir = Math.random() < 0.5 ? -1 : 1;
    for (const dx of [dir, -dir]) {
      const nx = x + dx;
      if (nx < 0 || nx >= COLS) continue;
      if (grid[up + dx] === EMPTY) { swap(idx, up + dx); return; }
    }
  }
}

function updateAcid(x, y, idx) {
  life[idx]--;
  if (life[idx] <= 0) {
    grid[idx] = SMOKE;
    life[idx] = 30;
    return;
  }

  // 溶解邻居
  if (Math.random() < 0.15) {
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
        const nidx = ny * COLS + nx;
        const n = grid[nidx];
        if ((n === SAND || n === STONE || n === WOOD) && Math.random() < 0.5) {
          grid[nidx] = SMOKE;
          life[nidx] = 20;
          life[idx] -= 20;
          if (life[idx] <= 0) { grid[idx] = EMPTY; return; }
        }
      }
    }
  }

  // 下落
  if (y < ROWS - 1) {
    const below = idx + COLS;
    if (grid[below] === EMPTY) { swap(idx, below); return; }
    const dir = Math.random() < 0.5 ? -1 : 1;
    for (const dx of [dir, -dir]) {
      const nx = x + dx;
      if (nx < 0 || nx >= COLS) continue;
      if (grid[below + dx] === EMPTY) { swap(idx, below + dx); return; }
    }
  }
  flowSideways(x, y, idx);
}

function step() {
  updated.fill(0);
  const flip = Math.random() > 0.5;

  for (let y = ROWS - 1; y >= 0; y--) {
    const rowOff = y * COLS;
    for (let i = 0; i < COLS; i++) {
      const x = flip ? COLS - 1 - i : i;
      const idx = rowOff + x;
      if (updated[idx]) continue;
      const t = grid[idx];
      if (t === EMPTY) continue;

      switch (t) {
        case SAND:  updateSand(x, y, idx);  break;
        case WATER: updateWater(x, y, idx); break;
        case ACID:  updateAcid(x, y, idx);  break;
        case FIRE:  updateFire(x, y, idx);  break;
        case SMOKE: updateSmoke(x, y, idx); break;
      }
    }
  }
}

/* ==================== 绘制到像素缓冲 ==================== */
function render() {
  let p = 0;
  for (let i = 0; i < grid.length; i++) {
    const t = grid[i];
    if (t === EMPTY) {
      pixels[p++] = 0; pixels[p++] = 0; pixels[p++] = 0; pixels[p++] = 0;
      continue;
    }

    let r, g, b, a = 255;

    if (t === FIRE) {
      const lt = Math.min(1, life[i] / 120);
      r = 255;
      g = 80 + Math.floor(175 * lt);
      b = Math.floor(60 * lt);
    } else if (t === SMOKE) {
      const lt = Math.min(1, life[i] / 80);
      const v = Math.floor(50 + 60 * lt);
      r = v; g = v; b = v + 10;
      a = Math.floor(70 + 140 * lt);
    } else {
      const m = MAT_MAP[t];
      const v = (hash(i) - 0.5) * m.vary;
      r = Math.max(0, Math.min(255, m.color[0] + v)) | 0;
      g = Math.max(0, Math.min(255, m.color[1] + v)) | 0;
      b = Math.max(0, Math.min(255, m.color[2] + v)) | 0;
    }

    pixels[p++] = r;
    pixels[p++] = g;
    pixels[p++] = b;
    pixels[p++] = a;
  }
  offCtx.putImageData(imgData, 0, 0);
}

/* ==================== 主画布绘制 ==================== */
function draw() {
  const bg = ctx.createRadialGradient(
    canvas.width / 2, canvas.height / 2, 0,
    canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) * 0.7
  );
  bg.addColorStop(0, '#0a1024');
  bg.addColorStop(0.6, '#06080f');
  bg.addColorStop(1, '#020308');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, 0, 0, COLS, ROWS, ox, oy, COLS * scale, ROWS * scale);
}

/* ==================== 绘制操作 ==================== */
function paint(gx, gy) {
  const r = brushSize;
  const r2 = r * r;
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      if (dx * dx + dy * dy > r2) continue;
      const x = gx + dx, y = gy + dy;
      if (x < 0 || x >= COLS || y < 0 || y >= ROWS) continue;
      const idx = y * COLS + x;

      if (currentMat === EMPTY) {
        grid[idx] = EMPTY;
        life[idx] = 0;
      } else {
        grid[idx] = currentMat;
        if (currentMat === FIRE) life[idx] = 80 + Math.random() * 60;
        else if (currentMat === ACID) life[idx] = 200;
        else life[idx] = 0;
      }
    }
  }
}

/* ==================== 坐标转换 ==================== */
function toGrid(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const x = (clientX - rect.left) * DPR;
  const y = (clientY - rect.top) * DPR;
  return {
    gx: Math.floor((x - ox) / scale),
    gy: Math.floor((y - oy) / scale),
  };
}

/* ==================== 鼠标 / 触摸 ==================== */
let painting = false;
let lastPaint = null;

function paintLine(gx, gy) {
  if (lastPaint) {
    const steps = Math.max(Math.abs(gx - lastPaint.gx), Math.abs(gy - lastPaint.gy));
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      paint(
        Math.round(lastPaint.gx + (gx - lastPaint.gx) * t),
        Math.round(lastPaint.gy + (gy - lastPaint.gy) * t)
      );
    }
  } else {
    paint(gx, gy);
  }
  lastPaint = { gx, gy };
}

canvas.addEventListener('mousedown', e => {
  painting = true;
  const { gx, gy } = toGrid(e.clientX, e.clientY);
  paint(gx, gy);
  lastPaint = { gx, gy };
});

canvas.addEventListener('mousemove', e => {
  if (!painting) return;
  const { gx, gy } = toGrid(e.clientX, e.clientY);
  paintLine(gx, gy);
});

canvas.addEventListener('mouseleave', () => { painting = false; lastPaint = null; });
window.addEventListener('mouseup', () => { painting = false; lastPaint = null; });

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  painting = true;
  const t = e.touches[0];
  const { gx, gy } = toGrid(t.clientX, t.clientY);
  paint(gx, gy);
  lastPaint = { gx, gy };
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!painting) return;
  const t = e.touches[0];
  const { gx, gy } = toGrid(t.clientX, t.clientY);
  paintLine(gx, gy);
}, { passive: false });

window.addEventListener('touchend', () => { painting = false; lastPaint = null; });

/* ==================== UI ==================== */
const paletteEl = document.getElementById('palette');

for (const m of MATERIALS) {
  const btn = document.createElement('button');
  btn.className = 'btn';
  if (m.id === currentMat) btn.classList.add('active');
  btn.dataset.mat = m.id;
  btn.innerHTML = `<span class="dot" style="background:rgb(${m.color.join(',')})"></span>${m.name}`;
  btn.addEventListener('click', () => {
    currentMat = m.id;
    document.querySelectorAll('.btn[data-mat]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
  paletteEl.appendChild(btn);
}

const eraserBtn = document.createElement('button');
eraserBtn.className = 'btn';
eraserBtn.dataset.mat = EMPTY;
eraserBtn.innerHTML = `<span class="dot" style="background:#222;border:1px solid #666"></span>橡皮擦`;
eraserBtn.addEventListener('click', () => {
  currentMat = EMPTY;
  document.querySelectorAll('.btn[data-mat]').forEach(b => b.classList.remove('active'));
  eraserBtn.classList.add('active');
});
paletteEl.appendChild(eraserBtn);

const brushEl = document.getElementById('brush');
const brushValEl = document.getElementById('brushVal');
brushEl.addEventListener('input', () => {
  brushSize = parseInt(brushEl.value);
  brushValEl.textContent = brushSize;
});

const pauseBtn = document.getElementById('pauseBtn');
pauseBtn.addEventListener('click', () => {
  paused = !paused;
  pauseBtn.textContent = paused ? '继续' : '暂停';
});

const clearBtn = document.getElementById('clearBtn');
clearBtn.addEventListener('click', () => {
  grid.fill(EMPTY);
  life.fill(0);
});

window.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    paused = !paused;
    pauseBtn.textContent = paused ? '继续' : '暂停';
  }
});

/* ==================== 主循环 ==================== */
function loop() {
  if (!paused) step();
  render();
  draw();
  requestAnimationFrame(loop);
}

loop();

})();
</script>
</body>
</html>
